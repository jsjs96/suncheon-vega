<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>순천 VEGA 배구동호회</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <style>
    /* FullCalendar UI 개선 및 토/일/공휴일 색상 정의 */
    .fc { font-family: inherit; }
    .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 800 !important; color: #0f172a; }
    .fc-button-primary { background-color: #1e1b4b !important; border-color: #1e1b4b !important; font-size: 0.75rem !important; font-weight: 700 !important; border-radius: 0.5rem !important; }
    .fc-button-primary:hover { background-color: #312e81 !important; border-color: #312e81 !important; }
    .fc-day-sat .fc-col-header-cell-cushion, .fc-day-sat .fc-daygrid-day-number { color: #2563eb !important; font-weight: bold; }
    .fc-day-sun .fc-col-header-cell-cushion, .fc-day-sun .fc-daygrid-day-number { color: #dc2626 !important; font-weight: bold; }
    .holiday-cell .fc-daygrid-day-number { color: #dc2626 !important; font-weight: bold; }
    .fc-theme-standard td, .fc-theme-standard th { border-color: #f1f5f9 !important; }
    .fc-event { border: none !important; border-radius: 6px !important; padding: 2px 4px !important; }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 pb-24 md:pb-8">

  <!-- ==================== Header ==================== -->
  <header class="bg-indigo-950 text-white p-4 shadow-md fixed top-0 left-0 right-0 z-50 flex justify-between items-center h-16">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🏐</span>
      <h1 class="text-xl font-black tracking-wider cursor-pointer" onclick="switchTab('home')">순천 VEGA</h1>
    </div>
    <div id="userHeaderArea" class="flex items-center gap-3"></div>
  </header>

  <!-- ==================== Navigation Bar ==================== -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-2 z-40 md:top-16 md:bottom-auto md:border-b md:border-t-0 md:justify-center md:gap-12 shadow-md h-14 md:h-12 items-center">
    <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-xs font-bold text-indigo-900">
      <span class="text-base md:text-sm">🏠</span> 홈
    </button>
    <button onclick="switchTab('calendar')" id="nav-calendar" class="flex flex-col items-center text-xs font-bold text-gray-400 hover:text-indigo-900">
      <span class="text-base md:text-sm">📅</span> 일정
    </button>
    <button onclick="switchTab('board')" id="nav-board" class="flex flex-col items-center text-xs font-bold text-gray-400 hover:text-indigo-900">
      <span class="text-base md:text-sm">📋</span> 게시판
    </button>
    <button onclick="switchTab('myinfo')" id="nav-myinfo" class="flex flex-col items-center text-xs font-bold text-gray-400 hover:text-indigo-900">
      <span class="text-base md:text-sm">👤</span> 나의 정보
    </button>
    <button onclick="switchTab('admin')" id="nav-admin" class="flex flex-col items-center text-xs font-bold text-gray-400 hover:text-indigo-900">
      <span class="text-base md:text-sm">⚙️</span> 운영진
    </button>
  </nav>

  <!-- ==================== Main Content ==================== -->
  <main id="app" class="max-w-5xl mx-auto p-4 mt-20 md:mt-24 min-h-[80vh]"></main>

  <!-- ==================== Modals ==================== -->
  <!-- 로그인 모달 -->
  <div id="loginModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <h2 class="text-2xl font-black text-indigo-950 mb-1 text-center">순천 VEGA 로그인</h2>
      <p class="text-xs text-gray-500 mb-4 text-center">이름과 비밀번호 4자리를 입력하세요.</p>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">이름</label>
          <input type="text" id="loginName" required placeholder="예: 홍길동 (운영진 접속: 회장)" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:outline-none text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">비밀번호 (초기: 0000)</label>
          <input type="password" id="loginPass" maxlength="4" required placeholder="숫자 4자리" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:outline-none text-sm" />
        </div>
        <div class="flex items-center">
          <input type="checkbox" id="rememberMe" class="w-4 h-4 text-indigo-900 border-gray-300 rounded focus:ring-indigo-600" checked>
          <label for="rememberMe" class="ml-2 block text-xs font-bold text-gray-700">자동 로그인 (로그인 상태 유지)</label>
        </div>
        <button type="submit" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-3 rounded-xl transition shadow-md">로그인</button>
      </form>
    </div>
  </div>

  <!-- 비밀번호 변경 모달 -->
  <div id="passwordModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <h2 class="text-xl font-black text-indigo-950 mb-2 text-center">비밀번호 변경</h2>
      <p id="passwordModalDesc" class="text-xs text-rose-600 font-bold mb-4 text-center">초기 비밀번호(0000)를 사용 중입니다. 새 비밀번호로 변경해 주세요.</p>
      <form onsubmit="handleChangePassword(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">새 비밀번호 (4자리)</label>
          <input type="password" id="newPass" maxlength="4" required placeholder="숫자 4자리" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-600 text-sm" />
        </div>
        <div class="flex gap-2">
          <button type="button" id="passModalCancelBtn" onclick="closePasswordModal()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-xs">취소</button>
          <button type="submit" id="passModalSubmitBtn" class="w-1/2 bg-indigo-900 text-white font-bold py-2.5 rounded-xl text-xs">변경하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 투표 현황 모달 -->
  <div id="voteStatusModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl relative max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 pb-3 border-b">
        <h2 id="voteModalTitle" class="text-base font-black text-indigo-950 truncate pr-2">투표 현황</h2>
        <button onclick="closeVoteModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <div id="voteModalContent" class="space-y-4 overflow-y-auto text-xs pr-1"></div>
      <button onclick="closeVoteModal()" class="mt-4 w-full bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl text-xs">닫기</button>
    </div>
  </div>

  <!-- 일정 상세 모달 -->
  <div id="eventDetailModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <div class="flex justify-between items-center mb-3 pb-2 border-b">
        <span id="eventCategoryBadge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-900">일정</span>
        <button onclick="closeEventDetailModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <h3 id="eventDetailTitle" class="text-lg font-black text-indigo-950 mb-3">일정 제목</h3>
      <div class="space-y-2 text-xs text-gray-600 mb-5 bg-gray-50 p-3 rounded-xl border border-gray-100">
        <p class="flex items-center gap-2"><span class="font-bold text-gray-800 w-12">📅 일시:</span> <span id="eventDetailTime"></span></p>
        <p class="flex items-center gap-2"><span class="font-bold text-gray-800 w-12">📍 장소:</span> <span id="eventDetailLocation"></span></p>
        <div class="pt-2 border-t border-gray-200 mt-2">
          <p class="font-bold text-gray-800 mb-1">📝 상세 내용:</p>
          <p id="eventDetailDesc" class="text-gray-600 whitespace-pre-line leading-relaxed"></p>
        </div>
      </div>
      <button onclick="closeEventDetailModal()" class="w-full bg-indigo-950 text-white font-bold py-2.5 rounded-xl text-xs">확인</button>
    </div>
  </div>

  <!-- 게시글/투표 작성 및 수정 모달 -->
  <div id="writePostModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 pb-2 border-b">
        <h3 id="writeModalTitle" class="text-base font-black text-indigo-950">새 게시글 작성</h3>
        <button onclick="closeWritePostModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <form onsubmit="handleCreatePost(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">카테고리</label>
          <select id="postCategorySelect" onchange="window.handleCategorySelectChange(this.value)" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs bg-white">
            <option value="자유게시판">자유게시판</option>
            <option value="영상게시판">영상게시판</option>
            <option value="🔒 익명 건의사항">🔒 익명 건의사항</option>
            <option value="투표게시판">🗳️ 투표게시판 (운영진 전용)</option>
            <option value="공지사항">📢 공지사항 (운영진 전용)</option>
          </select>
        </div>

        <!-- 일반 게시글 폼 필드 -->
        <div id="generalPostFields" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">제목</label>
            <input type="text" id="postTitleInput" placeholder="제목을 입력하세요" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
          </div>

          <div id="videoUrlField" class="hidden">
            <label class="block text-xs font-bold text-gray-700 mb-1">🎥 유튜브 링크 (URL)</label>
            <input type="url" id="postVideoUrlInput" placeholder="https://www.youtube.com/watch?v=..." class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">내용</label>
            <textarea id="postContentInput" rows="4" placeholder="내용을 입력하세요" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none"></textarea>
          </div>
          <div id="imageUploadField">
            <label class="block text-xs font-bold text-gray-700 mb-1">📷 이미지 첨부</label>
            <input type="file" id="postImageInput" accept="image/*" onchange="previewImage(event)" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-900 hover:file:bg-indigo-100" />
            <div id="imagePreviewContainer" class="mt-2 hidden">
              <img id="imagePreview" src="" alt="미리보기" class="w-full max-h-40 object-cover rounded-xl border border-gray-200" />
            </div>
          </div>
        </div>

        <!-- 투표 만들기/수정 폼 필드 -->
        <div id="votePostFields" class="space-y-3 hidden">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">특별 투표 항목 구분</label>
            <select id="voteItemCategory" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs bg-white font-bold">
              <option value="대회">🏆 대회</option>
              <option value="회식">🍻 회식</option>
              <option value="기타">📌 기타</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">투표 제목</label>
            <input type="text" id="voteTitleInput" placeholder="예: 2026 순천만배 전국 배구대회 참가 여부" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">투표 마감일</label>
            <input type="date" id="voteDeadlineInput" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">투표 선택지 설정</label>
            <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 text-xs text-gray-600 space-y-1">
              <p class="font-bold text-indigo-950 mb-1">기본 선택지 제공:</p>
              <div class="flex gap-2">
                <span class="bg-white border px-2 py-1 rounded font-bold">1. 참석</span>
                <span class="bg-white border px-2 py-1 rounded font-bold">2. 불참</span>
                <span class="bg-white border px-2 py-1 rounded font-bold">3. 미정</span>
              </div>
              <p class="text-[11px] text-gray-400 mt-2">* 투표 등록 및 수정 시 홈 화면 및 투표 게시판에 즉시 반영됩니다.</p>
            </div>
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeWritePostModal()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-xs">취소</button>
          <button type="submit" id="submitBtnText" class="w-1/2 bg-indigo-950 text-white font-bold py-2.5 rounded-xl text-xs">등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 게시글 상세 조회 모달 -->
  <div id="postDetailModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg shadow-2xl relative max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-3 pb-2 border-b">
        <span id="postDetailCategory" class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-900"></span>
        <button onclick="closePostDetailModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <div class="overflow-y-auto pr-1 space-y-4 flex-1">
        <div>
          <h3 id="postDetailTitle" class="text-base font-black text-gray-900 mb-1"></h3>
          <div class="flex items-center justify-between text-[11px] text-gray-400 border-b border-gray-100 pb-2">
            <span id="postDetailAuthor" class="font-bold text-indigo-900"></span>
            <span id="postDetailDate"></span>
          </div>
        </div>
        <div id="postDetailImageContainer" class="hidden">
          <img id="postDetailImage" src="" class="w-full rounded-xl object-cover max-h-60 border border-gray-100 shadow-sm" />
        </div>
        <div id="postDetailVideoContainer" class="hidden bg-indigo-50 p-3 rounded-xl border border-indigo-100 flex items-center justify-between">
          <span class="text-xs font-bold text-indigo-950 flex items-center gap-1.5">🎬 유튜브 동영상 URL 첨부됨</span>
          <button id="postDetailVideoBtn" onclick="" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition">
            ▶️ 유튜브에서 시청
          </button>
        </div>
        <p id="postDetailContent" class="text-xs text-gray-700 leading-relaxed whitespace-pre-line bg-gray-50 p-3 rounded-xl border border-gray-100"></p>
        
        <!-- 댓글 영역 -->
        <div class="pt-3 border-t border-gray-100">
          <h4 class="text-xs font-bold text-gray-900 mb-2">💬 댓글 목록</h4>
          <div id="postCommentsList" class="space-y-2 mb-3"></div>
          <form onsubmit="handleAddComment(event)" class="flex gap-2">
            <input type="text" id="commentInput" required placeholder="댓글을 입력하세요..." class="flex-1 p-2 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
            <button type="submit" class="bg-indigo-900 text-white px-3 py-2 rounded-xl text-xs font-bold shrink-0">작성</button>
          </form>
        </div>
      </div>
      <button onclick="closePostDetailModal()" class="mt-4 w-full bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl text-xs">닫기</button>
    </div>
  </div>

  <!-- [운영진 전용] 회원 정보 수정 모달 -->
  <div id="editMemberModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <h3 class="text-lg font-black text-indigo-950 mb-4">회원 정보 수정</h3>
      <form onsubmit="handleSaveEditMember(event)" class="space-y-3">
        <input type="hidden" id="editMemberDocId" />
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">회원 이름</label>
          <input type="text" id="editMemberName" required class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">직책</label>
          <select id="editMemberRole" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs bg-white">
            <option value="member">일반회원</option>
            <option value="admin">운영진</option>
          </select>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeEditMemberModal()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-xs">취소</button>
          <button type="submit" class="w-1/2 bg-indigo-950 text-white font-bold py-2.5 rounded-xl text-xs">수정 완료</button>
        </div>
      </form>
    </div>
  </div>

  <!-- [운영진 전용] 새 일정 추가 모달 -->
  <div id="addEventModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
      <div class="flex justify-between items-center mb-4 pb-2 border-b">
        <h3 class="text-base font-black text-indigo-950">📅 새 일정 추가</h3>
        <button onclick="closeAddEventModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <form onsubmit="handleCreateEvent(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">구분</label>
          <select id="newEventCategory" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs bg-white">
            <option value="regular">정기운동</option>
            <option value="match">대회 / 특별일정</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">일정 제목</label>
          <input type="text" id="newEventTitle" required placeholder="예: 금요 정기운동" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">날짜</label>
            <input type="date" id="newEventDate" required class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">시간</label>
            <input type="time" id="newEventTime" required value="19:30" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">장소</label>
          <input type="text" id="newEventLocation" required placeholder="예: 순천 조례초" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">상세 내용</label>

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function isKoreanHoliday(dateObj) {
      const year = dateObj.getFullYear();
      const month = dateObj.getMonth() + 1;
      const day = dateObj.getDate();
      const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const fixedHolidays = ["01-01", "03-01", "05-05", "06-06", "08-15", "10-03", "10-09", "12-25"];
      const monthDayStr = `${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      if (fixedHolidays.includes(monthDayStr)) return true;
      const variableHolidays = [
        "2026-02-16", "2026-02-17", "2026-02-18", "2026-05-24", "2026-05-25",
        "2026-09-24", "2026-09-25", "2026-09-26", "2026-10-05",
        "2027-02-06", "2027-02-07", "2027-02-08", "2027-02-09", "2027-05-13",
        "2027-09-14", "2027-09-15", "2027-09-16"
      ];
      return variableHolidays.includes(dateStr);
    }

    function calculateAttendanceStats() {
      const today = getTodayString();
      const pastRegularEvents = sampleData.events.filter(e => e.type === 'regular' && e.date < today);
      const totalPastEvents = pastRegularEvents.length;

      if (totalPastEvents === 0) {
        sampleData.stats = { myAttendance: "0%", myCount: "0/0회", teamAttendance: "0%", monthlyAttend: 0 };
        return;
      }

      let myAttendCount = 0;
      if (currentUser) {
        pastRegularEvents.forEach(evt => {
          const votes = sampleData.regularVotesByDate[evt.date] || {};
          if (votes[currentUser.name] === "참가") myAttendCount++;
        });
      }
      const myRate = Math.round((myAttendCount / totalPastEvents) * 100);

      const totalMembers = sampleData.members.length;
      let totalAttends = 0;

      if (totalMembers > 0) {
        pastRegularEvents.forEach(evt => {
          const votes = sampleData.regularVotesByDate[evt.date] || {};
          Object.values(votes).forEach(status => {
            if (status === "참가") totalAttends++;
          });
        });
        const teamRate = Math.round((totalAttends / (totalPastEvents * totalMembers)) * 100);
        sampleData.stats.teamAttendance = `${teamRate}%`;
      } else {
        sampleData.stats.teamAttendance = "0%";
      }

      sampleData.stats.myAttendance = `${myRate}%`;
      sampleData.stats.myCount = `${myAttendCount}/${totalPastEvents}회`;
      sampleData.stats.monthlyAttend = myAttendCount;
    }

    let renderTimer = null;
    function refreshCurrentTab() {
      calculateAttendanceStats();
      if (renderTimer) clearTimeout(renderTimer);
      renderTimer = setTimeout(() => {
        const app = document.getElementById('app');
        renderHeader();
        if (currentTab === 'home') renderHome(app);
        else if (currentTab === 'calendar') renderCalendarTab(app);
        else if (currentTab === 'board') renderBoardTab(app);
        else if (currentTab === 'myinfo') renderMyInfoTab(app);
        else if (currentTab === 'admin') renderAdminTab(app);
      }, 50);
    }

    function setupFirestoreListeners() {
      onSnapshot(collection(db, "members"), (snapshot) => {
        sampleData.members = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (currentUser) {
          const updatedSelf = sampleData.members.find(m => m.name === currentUser.name);
          if (updatedSelf) {
            currentUser.role = updatedSelf.role;
            if (localStorage.getItem('vega_user')) localStorage.setItem('vega_user', JSON.stringify(currentUser));
            else sessionStorage.setItem('vega_user', JSON.stringify(currentUser));
          }
        }
        refreshCurrentTab();
      });

      onSnapshot(collection(db, "posts"), (snapshot) => {
        sampleData.boardPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        refreshCurrentTab();
      });

      onSnapshot(collection(db, "comments"), (snapshot) => {
        sampleData.comments = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (currentViewingPostId) renderPostComments(currentViewingPostId);
        if (currentTab === 'myinfo') renderMyInfoTab(document.getElementById('app'));
      });

      onSnapshot(collection(db, "suggestions"), (snapshot) => {
        sampleData.suggestions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        refreshCurrentTab();
      });

      onSnapshot(collection(db, "events"), (snapshot) => {
        sampleData.events = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const regularEvents = sampleData.events.filter(e => e.type === 'regular');
        if (regularEvents.length > 0 && (!selectedHomeDate || !regularEvents.some(e => e.date === selectedHomeDate))) {
          selectedHomeDate = regularEvents[0].date;
        }
        if (regularEvents.length > 0 && (!selectedAdminDate || !regularEvents.some(e => e.date === selectedAdminDate))) {
          selectedAdminDate = regularEvents[0].date;
        }
        refreshCurrentTab();
      });

      onSnapshot(collection(db, "regularVotes"), (snapshot) => {
        const votes = {};
        snapshot.docs.forEach(doc => { votes[doc.id] = doc.data().votes || {}; });
        sampleData.regularVotesByDate = votes;
        refreshCurrentTab();
      });

      onSnapshot(collection(db, "specialVotes"), (snapshot) => {
        const votes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const configDoc = votes.find(v => v.id === "_config") || votes.find(v => v.title);
        const currentTitle = configDoc?.title || "2026 순천만배 전국 배구대회 참가 여부";
        const currentDeadline = configDoc?.deadline || "09월 20일까지";
        const currentItemCategory = configDoc?.itemCategory || "대회";

        const validUserVotes = votes.filter(v => v.id !== "_config");

        if (validUserVotes.length === 0 && !configDoc) {
          sampleData.specialVote = null;
        } else {
          const attendVoters = [];
          const absentVoters = [];
          const pendingVoters = [];

          validUserVotes.forEach(v => {
            const text = v.reason ? `${v.name} (${v.reason})` : v.name;
            if (v.choice === "참석") attendVoters.push(text);
            else if (v.choice === "불참") absentVoters.push(text);
            else pendingVoters.push(text);

            if (currentUser && v.name === currentUser.name) {
              if(!sampleData.specialVote) sampleData.specialVote = {};
              sampleData.specialVote.myStatus = { choice: v.choice, reason: v.reason || "" };
            }
          });

          sampleData.specialVote = {
            id: configDoc ? configDoc.id : "special_101",
            title: currentTitle, 
            deadline: currentDeadline,
            itemCategory: currentItemCategory,
            myStatus: sampleData.specialVote?.myStatus || { choice: "미정", reason: "" },
            results: [
              { choice: `참석 (${attendVoters.length}명)`, voters: attendVoters },
              { choice: `불참 (${absentVoters.length}명)`, voters: absentVoters },
              { choice: `미정 (${pendingVoters.length}명)`, voters: pendingVoters }
            ]
          };
        }

        sampleData.myVotes = validUserVotes.filter(v => currentUser && v.name === currentUser.name).map(v => ({
          title: sampleData.specialVote ? sampleData.specialVote.title : "특별 투표",
          choice: v.choice,
          date: v.date || "09.14"
        }));

        refreshCurrentTab();
      });
    }

    function paginate(array, pageSize, pageNumber) {
      return array.slice((pageNumber - 1) * pageSize, pageNumber * pageSize);
    }

    function renderPaginationUI(totalItems, pageSize, currentPage, onPageChangeFnName) {
      const totalPages = Math.ceil(totalItems / pageSize);
      if (totalPages <= 1) return '';

      let pageBtns = '';
      for (let i = 1; i <= totalPages; i++) {
        const isActive = i === currentPage;
        pageBtns += `
          <button onclick="window.${onPageChangeFnName}(${i})" class="w-7 h-7 text-xs font-bold rounded-lg transition ${isActive ? 'bg-indigo-950 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
            ${i}
          </button>
        `;
      }

      return `
        <div class="flex items-center justify-center gap-1.5 pt-4 border-t border-gray-100 mt-3">
          <button onclick="window.${onPageChangeFnName}(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="opacity-30 cursor-not-allowed text-xs px-2 py-1 font-bold text-gray-500"' : 'class="text-xs px-2 py-1 font-bold text-indigo-900 hover:bg-gray-100 rounded"'}>
            이전
          </button>
          <div class="flex items-center gap-1">${pageBtns}</div>
          <button onclick="window.${onPageChangeFnName}(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="opacity-30 cursor-not-allowed text-xs px-2 py-1 font-bold text-gray-500"' : 'class="text-xs px-2 py-1 font-bold text-indigo-900 hover:bg-gray-100 rounded"'}>
            다음
          </button>
        </div>
      `;
    }

      const userDocRef = doc(db, "members", name);
      const userDocSnap = await getDoc(userDocRef);

      let role = (name === "운영진" || name === "회장") ? "admin" : "member";
      let correctPass = "0000";

      if (userDocSnap.exists()) {
        const data = userDocSnap.data();

      currentUser = { name: name, role: role };

      if(!currentUser) return window.openLoginModal();
      const votesObj = sampleData.regularVotesByDate[dateKey] || {};
      votesObj[currentUser.name] = status;

      await setDoc(doc(db, "regularVotes", dateKey), { votes: votesObj }, { merge: true });
    };

    window.handleSpecialVote = async (e) => {
      e.preventDefault();
      if(!currentUser) return window.openLoginModal();
      
      const choiceEl = document.querySelector('input[name="v"]:checked');
      const choice = choiceEl ? choiceEl.value : '미정';
      const reason = document.getElementById('specialVoteReason').value;

      await setDoc(doc(db, "specialVotes", currentUser.name), {
        name: currentUser.name,
        choice: choice,
        reason: reason,
        date: "09.14",
        createdAt: serverTimestamp()
      });

      alert('투표 결과가 반영되었습니다.');
    };

    window.openVoteModal = (title) => {
      if (!sampleData.specialVote) return;

      const content = document.getElementById('voteModalContent');
      content.innerHTML = sampleData.specialVote.results.map(res => `
        <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
          <h4 class="font-bold text-indigo-900 mb-2">${res.choice}</h4>
          <div class="flex flex-wrap gap-1.5">

      document.getElementById('postCategorySelect').value = '투표게시판';
      document.getElementById('voteItemCategory').value = sampleData.specialVote.itemCategory || '대회';
      document.getElementById('voteTitleInput').value = sampleData.specialVote.title || '';
      
      window.handleCategorySelectChange('투표게시판');

      document.getElementById('writePostModal').classList.remove('hidden');
    };

    window.handleDeleteVote = async () => {
      if (!currentUser || currentUser.role !== 'admin') return alert('운영진만 삭제 가능합니다.');
      if (confirm('현재 진행 중인 특별 투표를 정말 삭제하시겠습니까?\n투표 참여 내역도 함께 초기화됩니다.')) {
        const specialVotesSnap = await getDocs(collection(db, "specialVotes"));
        for (const docItem of specialVotesSnap.docs) {
          await deleteDoc(doc(db, "specialVotes", docItem.id));
        }

        const postsSnap = await getDocs(collection(db, "posts"));
        for (const postDoc of postsSnap.docs) {
          if (postDoc.data().type === "투표") {
            await deleteDoc(doc(db, "posts", postDoc.id));
          }
        }

        sampleData.specialVote = null;
        alert('특별 투표가 정상적으로 삭제되었습니다.');
        refreshCurrentTab();

              </button>
            ` : ''}
          </div>
          <div id="calendar" class="text-sm"></div>
        </div>
      `;
      setTimeout(() => {
        const calendarEl = document.getElementById('calendar');
        const calendarEvents = sampleData.events.map(evt => ({
          id: evt.id,
          title: (evt.type === 'match' ? '🏆 ' : '🏐 ') + evt.title,
          start: `${evt.date}T${evt.time}:00`,
          color: evt.type === 'match' ? '#d97706' : '#1e1b4b',
          extendedProps: { ...evt }
        }));

        const calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: 'ko',
          headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
          events: calendarEvents,
          dayCellDidMount: function(arg) {
            if (isKoreanHoliday(arg.date)) {
              arg.el.classList.add('holiday-cell');
            }
          },
          eventClick: function(info) {
            window.openEventDetail(info.event.id);
          }
        });
        calendar.render();
      }, 50);
    }

      document.getElementById('eventDetailTitle').innerText = evt.title;
      document.getElementById('eventDetailTime').innerText = `${evt.date} ${evt.time}`;
      document.getElementById('eventDetailLocation').innerText = evt.location;
      document.getElementById('eventDetailDesc').innerText = evt.description || '상세 내용이 없습니다.';
      
      document.getElementById('eventDetailModal').classList.remove('hidden');

        if (!isEditingVote) {

        const postsSnap = await getDocs(collection(db, "posts"));

            await deleteDoc(doc(db, "posts", postDoc.id));

              <button onclick="window.openAddEventModal()" class="bg-indigo-950 text-white font-bold text-xs px-3 py-1.5 rounded-xl hover:bg-indigo-900 transition shadow-sm">+ 단일 일정 수동 추가</button>
            </div>

            <div class="overflow-x-auto min-h-[160px]">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="bg-gray-50 text-gray-500 border-b border-gray-100">
                    <th class="p-2.5">날짜/시간</th>
                    <th class="p-2.5">구분</th>
                    <th class="p-2.5">일정 제목</th>
                    <th class="p-2.5">장소</th>
                    <th class="p-2.5 text-right">관리</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                  ${pagedEvents.length === 0 ? '<tr><td colspan="5" class="p-4 text-center text-gray-400 text-xs">등록된 일정이 없습니다.</td></tr>' : ''}
                  ${pagedEvents.map(evt => `
                    <tr>
                      <td class="p-2.5 font-bold text-indigo-900">${evt.date} ${evt.time || ''}</td>
                      <td class="p-2.5">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${evt.type === 'match' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'}">
                          ${evt.type === 'match' ? '대회' : '정기'}
                        </span>
                      </td>
                      <td class="p-2.5 font-bold text-gray-800">${evt.title}</td>
                      <td class="p-2.5 text-gray-600">${evt.location || '-'}</td>
                      <td class="p-2.5 text-right">
                        <button onclick="window.deleteEvent('${evt.id}')" class="bg-rose-50 text-rose-600 font-bold px-2 py-1 rounded text-[10px] border border-rose-200 hover:bg-rose-100">삭제</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
            ${renderPaginationUI(sampleData.events.length, 5, pageState.adminEvents, 'changeAdminEventsPage')}
          </div>

          <!-- 정기운동 참가 현황 수동 관리 -->
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-base font-black text-gray-900 flex items-center gap-1.5"><span>🏐</span> 정기운동 참가 현황 수동 변경</h3>
              <div class="flex items-center gap-1">
                <label class="text-[11px] font-bold text-gray-600">대상 일정:</label>
                <select onchange="window.handleAdminDateChange(this.value)" class="p-1.5 border border-gray-300 rounded-lg text-xs font-bold bg-gray-50">
                  ${regularEvents.map(evt => `
                    <option value="${evt.date}" ${evt.date === selectedAdminDate ? 'selected' : ''}>
                      ${evt.date} (${evt.title})
                    </option>
                  `).join('')}
                </select>
              </div>
            </div>

            <div class="overflow-x-auto min-h-[160px]">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="bg-gray-50 text-gray-500 border-b border-gray-100">
                    <th class="p-2.5">회원명</th>
                    <th class="p-2.5">직책</th>
                    <th class="p-2.5">참가 상태 (${selectedAdminDate})</th>
                    <th class="p-2.5 text-right">수동 변경</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                  ${sampleData.members.map(m => {
                    const status = currentVotes[m.name] || "미정";
                    return `
                      <tr>
                        <td class="p-2.5 font-bold text-gray-900">${m.name}</td>
                        <td class="p-2.5"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${m.role === 'admin' ? 'bg-indigo-100 text-indigo-800' : 'bg-gray-100 text-gray-600'}">${m.role === 'admin' ? '운영진' : '회원'}</span></td>
                        <td class="p-2.5">
                          <span class="px-2 py-0.5 rounded text-[10px] font-bold ${status === '참가' ? 'bg-emerald-100 text-emerald-800' : status === '불참' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'}">
                            ${status}
                          </span>
                        </td>
                        <td class="p-2.5 text-right">
                          <div class="inline-flex gap-1">
                            <button onclick="window.updateAdminMemberVote('${m.name}', '참가')" class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">참가</button>
                            <button onclick="window.updateAdminMemberVote('${m.name}', '불참')" class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-700 border border-rose-200">불참</button>
                            <button onclick="window.updateAdminMemberVote('${m.name}', '미정')" class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">미정</button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- 회원 관리 -->
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-base font-black text-gray-900 mb-3 flex items-center gap-1.5"><span>👥</span> 동호회 회원 계정 관리</h3>
            <div class="overflow-x-auto min-h-[160px]">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="bg-gray-50 text-gray-500 border-b border-gray-100">
                    <th class="p-2.5">이름</th>
                    <th class="p-2.5">권한</th>
                    <th class="p-2.5">비밀번호</th>
                    <th class="p-2.5 text-right">관리</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                  ${pagedMembers.map(m => `
                    <tr>
                      <td class="p-2.5 font-bold text-gray-900">${m.name}</td>
                      <td class="p-2.5"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${m.role === 'admin' ? 'bg-indigo-100 text-indigo-800' : 'bg-gray-100 text-gray-600'}">${m.role === 'admin' ? '운영진' : '일반회원'}</span></td>
                      <td class="p-2.5 text-gray-500 font-mono">${m.password || '0000'}</td>
                      <td class="p-2.5 text-right">
                        <button onclick="window.resetMemberPassword('${m.name}')" class="bg-amber-50 text-amber-700 font-bold px-2 py-1 rounded text-[10px] border border-amber-200 hover:bg-amber-100 mr-1">비번초기화</button>
                        <button onclick="window.openEditMemberModal('${m.name}', '${m.role}')" class="bg-gray-100 text-gray-700 font-bold px-2 py-1 rounded text-[10px] hover:bg-gray-200">수정</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
            ${renderPaginationUI(sampleData.members.length, 5, pageState.adminMembers, 'changeAdminMembersPage')}
          </div>

          <!-- 익명 건의함 (수정사항 1: 운영진 상태 변경 select 추가) -->
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-base font-black text-gray-900 mb-3 flex items-center gap-1.5"><span>🔒</span> 익명 건의함 접수 목록</h3>
            <div class="space-y-2 min-h-[160px]">
              ${pagedSuggestions.length === 0 ? '<p class="text-xs text-gray-400 py-6 text-center">접수된 건의사항이 없습니다.</p>' : ''}
              ${pagedSuggestions.map(s => `
                <div class="p-3 bg-gray-50 rounded-xl flex justify-between items-center text-xs">
                  <div>
                    <div class="flex items-center gap-2 mb-1">
                      <span class="text-[10px] text-gray-400">${s.date}</span>
                      <select onchange="window.updateSuggestionStatus('${s.id}', this.value)" class="text-[10px] font-bold px-1.5 py-0.5 rounded border border-gray-300 bg-white cursor-pointer ${s.status === '처리완료' ? 'text-emerald-800 bg-emerald-50' : s.status === '처리중' ? 'text-blue-800 bg-blue-50' : 'text-amber-800 bg-amber-50'}">
                        <option value="검토중" ${s.status === '검토중' ? 'selected' : ''}>검토중</option>
                        <option value="처리중" ${s.status === '처리중' ? 'selected' : ''}>처리중</option>
                        <option value="처리완료" ${s.status === '처리완료' ? 'selected' : ''}>처리완료</option>
                      </select>
                    </div>
                    <p class="font-bold text-gray-800">${s.text}</p>
                  </div>
                  <button onclick="window.deleteSuggestion('${s.id}')" class="text-rose-500 font-bold text-[10px] hover:underline shrink-0 ml-2">삭제</button>
                </div>
              `).join('')}
            </div>
            ${renderPaginationUI(sampleData.suggestions.length, 5, pageState.adminSuggestions, 'changeAdminSuggestionsPage')}
          </div>
        </div>
      `;
    }

    window.changeAdminMembersPage = (p) => { pageState.adminMembers = p; renderAdminTab(document.getElementById('app')); };
    window.changeAdminSuggestionsPage = (p) => { pageState.adminSuggestions = p; renderAdminTab(document.getElementById('app')); };
    window.changeAdminEventsPage = (p) => { pageState.adminEvents = p; renderAdminTab(document.getElementById('app')); };

    window.handleAdminDateChange = (dStr) => {
      selectedAdminDate = dStr;
      renderAdminTab(document.getElementById('app'));
    };

    window.updateAdminMemberVote = async (memberName, status) => {
      const votesObj = sampleData.regularVotesByDate[selectedAdminDate] || {};
      votesObj[memberName] = status;

      await setDoc(doc(db, "regularVotes", selectedAdminDate), { votes: votesObj }, { merge: true });
    };

    window.handleAutoGenerateMonthlyEvents = async (e) => {
      e.preventDefault();
      const monthStr = document.getElementById('autoGenMonth').value;
      const timeStr = document.getElementById('autoGenTime').value;
      const locStr = document.getElementById('autoGenLocation').value;
      const descStr = document.getElementById('autoGenDesc').value;

      const selectedDays = Array.from(document.querySelectorAll('input[name="autoDay"]:checked')).map(cb => parseInt(cb.value));

      if (selectedDays.length === 0) return alert('최소 하나 이상의 요일을 선택해 주세요.');

      const [year, month] = monthStr.split('-').map(Number);
      const daysInMonth = new Date(year, month, 0).getDate();

      let createdCount = 0;
      let skippedHolidays = [];

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month - 1, day);
        const dayOfWeek = dateObj.getDay();

        if (selectedDays.includes(dayOfWeek)) {
          const formattedDay = String(day).padStart(2, '0');
          const dateString = `${year}-${String(month).padStart(2, '0')}-${formattedDay}`;

          if (isKoreanHoliday(dateObj)) {
            skippedHolidays.push(dateString);
            continue;
          }

          const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
          const title = `${dayNames[dayOfWeek]}요 정기운동`;

          await addDoc(collection(db, "events"), {
            title: title,
            date: dateString,
            time: timeStr,
            location: locStr,
            description: descStr,
            type: "regular",
            createdAt: serverTimestamp()
          });
          createdCount++;
        }
      }

      let msg = `${monthStr}월 정기 운동 일정 ${createdCount}개가 성공적으로 생성되었습니다.`;
      if (skippedHolidays.length > 0) {
        msg += `\n\n[공휴일 제외 목록]\n${skippedHolidays.join('\n')}`;
      }
      alert(msg);
    };

    window.deleteEvent = async (eventId) => {
      if (confirm('일정을 삭제하시겠습니까?')) {
        await deleteDoc(doc(db, "events", String(eventId)));
      }
    };

    window.deleteSuggestion = async (suggId) => {
      if (confirm('건의사항을 삭제하시겠습니까?')) {
        await deleteDoc(doc(db, "suggestions", String(suggId)));
      }
    };

    window.resetMemberPassword = async (memberName) => {
      if (confirm(`${memberName} 회원의 비밀번호를 초기 비밀번호(0000)로 리셋하시겠습니까?`)) {
        await setDoc(doc(db, "members", memberName), { password: "0000" }, { merge: true });
        alert(`${memberName} 회원의 비밀번호가 0000으로 리셋되었습니다.`);
      }
    };

    window.openEditMemberModal = (name, role) => {
      document.getElementById('editMemberDocId').value = name;
      document.getElementById('editMemberName').value = name;
      document.getElementById('editMemberRole').value = role || 'member';
      document.getElementById('editMemberModal').classList.remove('hidden');
    };

    window.closeEditMemberModal = () => document.getElementById('editMemberModal').classList.add('hidden');

    window.handleSaveEditMember = async (e) => {
      e.preventDefault();
      const docId = document.getElementById('editMemberDocId').value;
      const newName = document.getElementById('editMemberName').value.trim();
      const newRole = document.getElementById('editMemberRole').value;

      if (docId !== newName) {
        const oldSnap = await getDoc(doc(db, "members", docId));
        const oldData = oldSnap.exists() ? oldSnap.data() : {};
        await setDoc(doc(db, "members", newName), { ...oldData, name: newName, role: newRole });
        await deleteDoc(doc(db, "members", docId));
      } else {
        await setDoc(doc(db, "members", newName), { role: newRole }, { merge: true });
      }

      alert('회원 정보가 수정되었습니다.');
      window.closeEditMemberModal();
    };

    window.openAddEventModal = () => {
      if (!currentUser || currentUser.role !== 'admin') return alert('운영진만 작성 가능합니다.');
      document.getElementById('newEventDate').value = getTodayString();
      document.getElementById('addEventModal').classList.remove('hidden');
    };

    window.closeAddEventModal = () => document.getElementById('addEventModal').classList.add('hidden');

    window.handleCreateEvent = async (e) => {
      e.preventDefault();
      const category = document.getElementById('newEventCategory').value;
      const title = document.getElementById('newEventTitle').value.trim();
      const date = document.getElementById('newEventDate').value;
      const time = document.getElementById('newEventTime').value;
      const location = document.getElementById('newEventLocation').value.trim();
      const desc = document.getElementById('newEventDesc').value.trim();

      await addDoc(collection(db, "events"), {
        title: title,
        date: date,
        time: time,
        location: location,
        description: desc,
        type: category,
        createdAt: serverTimestamp()
      });

      alert('새 일정이 추가되었습니다.');
      window.closeAddEventModal();
    };

    window.addEventListener('DOMContentLoaded', () => {
      setupFirestoreListeners();
      switchTab('home');
    });
  </script>
</body>
</html>
