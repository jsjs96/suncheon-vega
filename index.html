<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1b4b">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VEGA">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>순천 VEGA 배구동호회</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <style>
    /* 반응형 및 기본 폰트 크기 자동 조정을 위한 clamp 설정 */
    html {
      font-size: clamp(13px, 3.5vw, 16px);
    }

    /* FullCalendar UI 개선 및 모바일 반응형 커스텀 */
    .fc { font-family: inherit; }
    
    /* 달력 크기 및 셀 높이 고정 및 넘침 방지 */
    .fc-theme-standard .fc-scrollgrid {
      border-color: #f1f5f9 !important;
    }
    .fc-daygrid-day-frame {
      min-height: 75px !important;
      max-height: 90px !important;
      overflow: hidden !important;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    
    /* 캘린더 헤더/날짜 폰트 가변 설정 */
    .fc-toolbar-title { font-size: clamp(0.9rem, 3.5vw, 1.1rem) !important; font-weight: 800 !important; color: #0f172a; }
    .fc-col-header-cell-cushion { font-size: clamp(0.65rem, 2.5vw, 0.8rem) !important; padding: 2px !important; }
    .fc-daygrid-day-number { font-size: clamp(0.65rem, 2.5vw, 0.8rem) !important; padding: 2px 4px !important; }
    
    .fc-button-primary { background-color: #1e1b4b !important; border-color: #1e1b4b !important; font-size: clamp(0.65rem, 2vw, 0.75rem) !important; font-weight: 700 !important; border-radius: 0.5rem !important; padding: 4px 8px !important; }
    .fc-button-primary:hover { background-color: #312e81 !important; border-color: #312e81 !important; }
    
    /* 토/일/공휴일 색상 정의 */
    .fc-day-sat .fc-col-header-cell-cushion, .fc-day-sat .fc-daygrid-day-number { color: #2563eb !important; font-weight: bold; }
    .fc-day-sun .fc-col-header-cell-cushion, .fc-day-sun .fc-daygrid-day-number { color: #dc2626 !important; font-weight: bold; }
    .holiday-cell .fc-daygrid-day-number { color: #dc2626 !important; font-weight: bold; }
    .fc-theme-standard td, .fc-theme-standard th { border-color: #f1f5f9 !important; }
    
    /* 공휴일 텍스트 표시 스타일 */
    .holiday-name-label {
      font-size: 0.6rem;
      color: #dc2626;
      font-weight: bold;
      padding: 0 4px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 달력 내부 이벤트 박스 및 글씨 크기 조정 (초기 기본값, 실제 크기는 JS가 셀 너비에 맞춰 자동 조정) */
    .fc-event { 
      border: none !important; 
      border-radius: 4px !important; 
      padding: 1px 3px !important; 
      font-size: clamp(0.5rem, 2vw, 0.7rem); 
      line-height: 1.2 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      cursor: pointer;
    }
    .fc-event-title {
      font-size: clamp(0.5rem, 2vw, 0.7rem);
      font-weight: 600;
      display: inline-block;
      max-width: 100%;
    }

    .truncate-custom {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* [수정] 달력 일정 앞의 동그라미(점) 아이콘 제거 → 이모지 + 글자만 표시 */
    .fc-daygrid-event-dot,
    .fc-list-event-dot { display: none !important; }
    .fc-daygrid-dot-event .fc-event-title { margin: 0 !important; }

    /* [수정] 달력 글자(일정/공휴일)는 JS가 모두 동일한 크기로 맞춰 줌.
       최소 크기까지 줄여도 넘칠 경우에만 줄바꿈하여 글자가 잘리지 않게 처리 */
    .fc-wrap-mode .fc-event,
    .fc-wrap-mode .fc-event-title,
    .fc-wrap-mode .holiday-name-label {
      white-space: normal !important;
      overflow: visible !important;
      text-overflow: clip !important;
      overflow-wrap: anywhere;
      line-height: 1.15 !important;
    }
    .fc-wrap-mode .fc-daygrid-day-frame {
      max-height: none !important;
      overflow: visible !important;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 pb-24 md:pb-8">

  <!-- ==================== Header ==================== -->
  <header class="bg-indigo-950 text-white px-4 shadow-md fixed top-0 left-0 right-0 z-50 flex justify-between items-center h-16">
    <div class="flex items-center space-x-2 min-w-0">
      <span class="text-xl sm:text-2xl shrink-0">🏐</span>
      <h1 class="text-lg sm:text-xl font-black tracking-wider cursor-pointer truncate" onclick="switchTab('home')">순천 VEGA</h1>
    </div>
    <div id="userHeaderArea" class="flex items-center gap-2 shrink-0"></div>
  </header>

  <!-- ==================== Navigation Bar ==================== -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-1 sm:p-2 z-40 md:top-16 md:bottom-auto md:border-b md:border-t-0 md:justify-center md:gap-12 shadow-md h-14 md:h-12 items-center">
    <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-[10px] sm:text-xs font-bold text-indigo-900">
      <span class="text-base md:text-sm">🏠</span> 홈
    </button>
    <button onclick="switchTab('calendar')" id="nav-calendar" class="flex flex-col items-center text-[10px] sm:text-xs font-bold text-gray-400 hover:text-indigo-900">
      <span class="text-base md:text-sm">📅</span> 일정
    </button>
    <button onclick="switchTab('board')" id="nav-board" class="flex flex-col items-center text-[10px] sm:text-xs font-bold text-gray-400 hover:text-indigo-900">
      <span class="text-base md:text-sm">📋</span> 게시판
    </button>
    <button onclick="switchTab('myinfo')" id="nav-myinfo" class="flex flex-col items-center text-[10px] sm:text-xs font-bold text-gray-400 hover:text-indigo-900">
      <span class="text-base md:text-sm">👤</span> 나의 정보
    </button>
    <button onclick="switchTab('admin')" id="nav-admin" class="flex flex-col items-center text-[10px] sm:text-xs font-bold text-gray-400 hover:text-indigo-900">
      <span class="text-base md:text-sm">⚙️</span> 운영진
    </button>
  </nav>

  <!-- ==================== Main Content ==================== -->
  <main id="app" class="max-w-5xl mx-auto p-3 sm:p-4 mt-16 md:mt-24 min-h-[80vh]"></main>

  <!-- ==================== Modals ==================== -->
  <!-- 로그인 모달 -->
  <div id="loginModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <h2 class="text-xl sm:text-2xl font-black text-indigo-950 mb-1 text-center">순천 VEGA 로그인</h2>
      <p class="text-xs text-gray-500 mb-4 text-center">이름과 비밀번호 4자리를 입력하세요.</p>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">이름</label>
          <input type="text" id="loginName" required placeholder="예: 홍길동 (운영진 접속: 회장)" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:outline-none text-xs sm:text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">비밀번호 (초기: 0000)</label>
          <input type="password" id="loginPass" maxlength="4" required placeholder="숫자 4자리" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:outline-none text-xs sm:text-sm" />
        </div>
        <div class="flex items-center">
          <input type="checkbox" id="rememberMe" class="w-4 h-4 text-indigo-900 border-gray-300 rounded focus:ring-indigo-600" checked>
          <label for="rememberMe" class="ml-2 block text-xs font-bold text-gray-700">자동 로그인 (로그인 상태 유지)</label>
        </div>
        <button type="submit" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-3 rounded-xl transition shadow-md text-xs sm:text-sm">로그인</button>
      </form>
    </div>
  </div>

  <!-- 비밀번호 변경 모달 -->
  <div id="passwordModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <h2 class="text-lg sm:text-xl font-black text-indigo-950 mb-2 text-center">비밀번호 변경</h2>
      <p id="passwordModalDesc" class="text-xs text-rose-600 font-bold mb-4 text-center">초기 비밀번호(0000)를 사용 중입니다. 새 비밀번호로 변경해 주세요.</p>
      <form onsubmit="handleChangePassword(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">새 비밀번호 (4자리)</label>
          <input type="password" id="newPass" maxlength="4" required placeholder="숫자 4자리" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-600 text-xs sm:text-sm" />
        </div>
        <div class="flex gap-2">
          <button type="button" id="passModalCancelBtn" onclick="closePasswordModal()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-xs">취소</button>
          <button type="submit" id="passModalSubmitBtn" class="w-1/2 bg-indigo-900 text-white font-bold py-2.5 rounded-xl text-xs">변경하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 일정 상세 모달 (운영진 전용 수정/삭제 버튼 추가) -->
  <div id="eventDetailModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <div class="flex justify-between items-center mb-3 pb-2 border-b">
        <span id="eventCategoryBadge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-900">일정</span>
        <button onclick="closeEventDetailModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <h3 id="eventDetailTitle" class="text-base sm:text-lg font-black text-indigo-950 mb-3 break-keep">일정 제목</h3>
      <div class="space-y-2 text-xs text-gray-600 mb-5 bg-gray-50 p-3 rounded-xl border border-gray-100">
        <p class="flex items-center gap-2"><span class="font-bold text-gray-800 w-12 shrink-0">📅 일시:</span> <span id="eventDetailTime" class="break-all"></span></p>
        <p class="flex items-center gap-2"><span class="font-bold text-gray-800 w-12 shrink-0">📍 장소:</span> <span id="eventDetailLocation" class="break-all"></span></p>
        <div class="pt-2 border-t border-gray-200 mt-2">
          <p class="font-bold text-gray-800 mb-1">📝 상세 내용:</p>
          <p id="eventDetailDesc" class="text-gray-600 whitespace-pre-line leading-relaxed break-all"></p>
        </div>
      </div>

      <!-- [추가] 운영진 전용 일정 수정/삭제 영역 -->
      <div id="eventDetailAdminActions" class="hidden">
        <div class="flex gap-2 mb-2">
          <button onclick="window.editCurrentEvent()" class="w-1/2 bg-indigo-50 hover:bg-indigo-100 text-indigo-800 border border-indigo-200 font-bold py-2.5 rounded-xl text-xs transition">✏️ 일정 수정</button>
          <button onclick="window.deleteCurrentEvent()" class="w-1/2 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold py-2.5 rounded-xl text-xs transition">🗑️ 일정 삭제</button>
        </div>
      </div>

      <button onclick="closeEventDetailModal()" class="w-full bg-indigo-950 text-white font-bold py-2.5 rounded-xl text-xs">확인</button>
    </div>
  </div>

  <!-- 게시글 작성 및 수정 모달 -->
  <div id="writePostModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 pb-2 border-b">
        <h3 id="writeModalTitle" class="text-sm sm:text-base font-black text-indigo-950">새 게시글 작성</h3>
        <button onclick="closeWritePostModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <form onsubmit="handleCreatePost(event)" class="space-y-3">
        <!-- [추가] 게시글 수정 모드 식별용 -->
        <input type="hidden" id="editPostId" value="" />
        <input type="hidden" id="editPostCategory" value="" />
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">카테고리</label>
          <select id="postCategorySelect" onchange="window.handleCategorySelectChange(this.value)" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs bg-white">
            <option value="자유게시판">자유게시판</option>
            <option value="영상게시판">영상게시판</option>
            <option value="🔒 익명 건의사항">🔒 익명 건의사항</option>
            <option value="공지사항">📢 공지사항 (운영진 전용)</option>
          </select>
        </div>

        <!-- [추가] 익명 건의사항 안내 문구 -->
        <div id="suggestionNotice" class="hidden bg-amber-50 border border-amber-200 text-amber-800 text-[11px] leading-relaxed p-2.5 rounded-xl">
          🔒 <strong>익명 건의사항</strong>은 작성자 이름이 어디에도 표시되지 않습니다.<br/>
          열람은 <strong>운영진</strong>과 <strong>작성자 본인</strong>만 가능합니다.
        </div>

        <!-- 일반 게시글 폼 필드 -->
        <div id="generalPostFields" class="space-y-3">
          <div id="postTitleField">
            <label class="block text-xs font-bold text-gray-700 mb-1">제목</label>
            <input type="text" id="postTitleInput" placeholder="제목을 입력하세요" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
          </div>

          <div id="videoUrlField" class="hidden">
            <label class="block text-xs font-bold text-gray-700 mb-1">🎥 유튜브 링크 (URL)</label>
            <input type="url" id="postVideoUrlInput" placeholder="https://www.youtube.com/watch?v=..." class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">내용</label>
            <textarea id="postContentInput" rows="4" placeholder="내용을 입력하세요" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none"></textarea>
          </div>
          <div id="imageUploadField">
            <label class="block text-xs font-bold text-gray-700 mb-1">📷 이미지 첨부</label>
            <input type="file" id="postImageInput" accept="image/*" onchange="previewImage(event)" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-900 hover:file:bg-indigo-100" />
            <div id="imagePreviewContainer" class="mt-2 hidden">
              <img id="imagePreview" src="" alt="미리보기" class="w-full max-h-40 object-cover rounded-xl border border-gray-200" />
            </div>
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeWritePostModal()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-xs">취소</button>
          <button type="submit" id="submitBtnText" class="w-1/2 bg-indigo-950 text-white font-bold py-2.5 rounded-xl text-xs">등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 게시글 상세 조회 모달 -->
  <div id="postDetailModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg shadow-2xl relative max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-3 pb-2 border-b">
        <span id="postDetailCategory" class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-900"></span>
        <div class="flex items-center gap-2">
          <!-- [추가] 작성자 본인 전용 수정 버튼 -->
          <button id="postDetailEditBtn" onclick="" class="hidden text-xs bg-indigo-50 text-indigo-800 hover:bg-indigo-100 px-2 py-1 rounded-lg font-bold border border-indigo-200">
            ✏️ 수정
          </button>
          <button id="postDetailDeleteBtn" onclick="" class="hidden text-xs bg-rose-50 text-rose-600 hover:bg-rose-100 px-2 py-1 rounded-lg font-bold border border-rose-200">
            🗑️ 삭제
          </button>
          <button onclick="closePostDetailModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
        </div>
      </div>
      <div class="overflow-y-auto pr-1 space-y-4 flex-1">
        <div>
          <h3 id="postDetailTitle" class="text-sm sm:text-base font-black text-gray-900 mb-1 break-all"></h3>
          <div class="flex items-center justify-between text-[11px] text-gray-400 border-b border-gray-100 pb-2">
            <span id="postDetailAuthor" class="font-bold text-indigo-900"></span>
            <span id="postDetailDate"></span>
          </div>
        </div>
        <div id="postDetailImageContainer" class="hidden">
          <img id="postDetailImage" src="" onclick="window.openImageLightbox(this.src)" class="w-full rounded-xl object-cover max-h-60 border border-gray-100 shadow-sm cursor-zoom-in" />
        </div>
        <div id="postDetailVideoContainer" class="hidden bg-indigo-50 p-3 rounded-xl border border-indigo-100 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
          <span class="text-xs font-bold text-indigo-950 flex items-center gap-1.5">🎬 유튜브 동영상 URL 첨부됨</span>
          <button id="postDetailVideoBtn" onclick="" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition shrink-0">
            ▶️ 시청하기
          </button>
        </div>
        <p id="postDetailContent" class="text-xs text-gray-700 leading-relaxed whitespace-pre-line bg-gray-50 p-3 rounded-xl border border-gray-100 break-all"></p>
        
        <!-- 댓글 영역 -->
        <div class="pt-3 border-t border-gray-100">
          <h4 class="text-xs font-bold text-gray-900 mb-2">💬 댓글 목록</h4>
          <div id="postCommentsList" class="space-y-2 mb-3"></div>
          <form onsubmit="handleAddComment(event)" class="flex gap-2">
            <input type="text" id="commentInput" required placeholder="댓글을 입력하세요..." class="flex-1 p-2 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
            <button type="submit" class="bg-indigo-900 text-white px-3 py-2 rounded-xl text-xs font-bold shrink-0">작성</button>
          </form>
        </div>
      </div>
      <button onclick="closePostDetailModal()" class="mt-4 w-full bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl text-xs">닫기</button>
    </div>
  </div>

  <!-- 첨부 사진 전체화면 보기 모달 -->
  <div id="imageLightboxModal" class="fixed inset-0 bg-black/90 z-[60] hidden items-center justify-center p-4" onclick="window.closeImageLightbox()">
    <button onclick="window.closeImageLightbox()" class="absolute top-4 right-4 text-white text-3xl font-bold leading-none">&times;</button>
    <img id="lightboxImage" src="" class="max-w-full max-h-full object-contain rounded-lg" />
  </div>

  <!-- [운영진 전용] 새 회원 명단 추가 모달 -->
  <div id="addMemberModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <h3 class="text-base sm:text-lg font-black text-indigo-950 mb-4">👤 새 회원 명단 추가</h3>
      <form onsubmit="handleCreateMember(event)" class="space-y-3">
        <div>

    function sortMembers(members) {
      return [...members].sort((a, b) => {

        if (orderA !== orderB) return orderA - orderB;
        return (a.name || '').localeCompare(b.name || '', 'ko');
      });
    }

    function sortEventsByDate(events) {
      const today = getTodayString();
      const future = events.filter(e => !isEventPast(e)).sort((a, b) => {
        if (a.date !== b.date) return a.date.localeCompare(b.date);
        return (a.time || '').localeCompare(b.time || '');
      });
      const past = events.filter(e => isEventPast(e)).sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return (b.time || '').localeCompare(a.time || '');
      });
      return [...future, ...past];
    }

    let pageState = {
      homePosts: 1,

      myPosts: 1,

      adminMembers: 1,

      adminReactions: 1        // [추가] 운동 후기 기록 페이지네이션
    };

    const sampleData = {
      members: [],
      regularVotesByDate: {},
      stats: { myAttendance: "0%", myCount: "0회 / 0회", teamAttendance: "0%", monthlyAttend: 0 },
      boardPosts: [],
      comments: [],
      suggestions: [],
      events: []
    };

    /* 게시글/영상 목록 정렬: 배포(등록) 날짜 기준 최신순 정렬 */
    function sortPostsByDate(posts) {
      const getTime = (p) => {
        if (p.createdAt && typeof p.createdAt.toMillis === 'function') return p.createdAt.toMillis();
        if (p.createdAt && typeof p.createdAt.seconds === 'number') return p.createdAt.seconds * 1000;
        return 0;
      };
      return [...posts].sort((a, b) => {
        const diff = getTime(b) - getTime(a);
        if (diff !== 0) return diff;
        return (b.date || '').localeCompare(a.date || '');
      });
    }

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    /* 한국의 모든 공휴일 정보 데이터베이스 및 판별 함수 */

      "2026-03-02": "대체공휴일",
      "2026-05-05": "어린이날",

      "2026-08-17": "대체공휴일",
      "2026-09-24": "추석 연휴",

      "2027-10-03": "개천절",
      "2027-10-04": "대체공휴일",
      "2027-10-09": "한글날",
      "2027-12-25": "성탄절"
    };

    function getKoreanHolidayName(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      const dateStr = `${year}-${month}-${day}`;
      
      if (holidayMap[dateStr]) return holidayMap[dateStr];
      
      // 고정 매년 공휴일 체크 (맵에 등록 안된 경우 대비)
      const monthDayStr = `${month}-${day}`;
      const fixedHolidays = {
        "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날",
        "06-06": "현충일", "08-15": "광복절", "10-03": "개천절",
        "10-09": "한글날", "12-25": "성탄절"
      };
      return fixedHolidays[monthDayStr] || null;
    }

    function isKoreanHoliday(dateObj) {
      return getKoreanHolidayName(dateObj) !== null;
    }

    /* 출석률 계산 시 운영진과 일반 회원 대상으로만 정확히 계산 */
    function calculateAttendanceStats() {
      const today = getTodayString();
      const pastRegularEvents = sampleData.events.filter(e => e.type === 'regular' && isEventPast(e));
      const totalPastEvents = pastRegularEvents.length;

      // 출석 집계 대상 회원: 운영진(admin) & 일반회원(member) 전용 (쉼회원, 코치 제외)
      const targetMembers = sampleData.members.filter(m => m.role === 'admin' || m.role === 'member');
      const totalTargetMembersCount = targetMembers.length;

      if (totalPastEvents === 0) {
        sampleData.stats = { myAttendance: "0%", myCount: "0/0회", teamAttendance: "0%", monthlyAttend: 0 };
        return;
      }

      let myAttendCount = 0;
      if (currentUser) {
        pastRegularEvents.forEach(evt => {
          const votes = sampleData.regularVotesByDate[evt.date] || {};
          if (votes[currentUser.name] === "참가") myAttendCount++;
        });
      }
      const myRate = Math.round((myAttendCount / totalPastEvents) * 100);

      let totalAttends = 0;

      if (totalTargetMembersCount > 0) {
        pastRegularEvents.forEach(evt => {
          const votes = sampleData.regularVotesByDate[evt.date] || {};
          targetMembers.forEach(m => {
            if (votes[m.name] === "참가") totalAttends++;
          });
        });
        const teamRate = Math.round((totalAttends / (totalPastEvents * totalTargetMembersCount)) * 100);
        sampleData.stats.teamAttendance = `${teamRate}%`;
      } else {
        sampleData.stats.teamAttendance = "0%";
      }

      sampleData.stats.myAttendance = `${myRate}%`;
      sampleData.stats.myCount = `${myAttendCount}/${totalPastEvents}회`;
      sampleData.stats.monthlyAttend = myAttendCount;
    }

    /* [추가] 출석률 순위 산출
       - 모수: 오늘 이전에 끝난 '정기운동(regular)' 일정만 집계
       - 대상: 운영진(admin) + 일반회원(member) (쉼회원/코치 제외)
       - 정렬: 출석률 내림차순 → 참석 횟수 내림차순 → 이름 가나다순
       - 동률은 같은 순위를 부여 */
    function getAttendanceRanking() {
      const today = getTodayString();
      const pastRegularEvents = sampleData.events.filter(e => e.type === 'regular' && isEventPast(e));
      const totalPastEvents = pastRegularEvents.length;

      const targetMembers = sampleData.members.filter(m => m.role === 'admin' || m.role === 'member');

      const rows = targetMembers.map(m => {
        let attendCount = 0;
        let absentCount = 0;
        pastRegularEvents.forEach(evt => {
          const votes = sampleData.regularVotesByDate[evt.date] || {};
          if (votes[m.name] === '참가') attendCount++;
          else if (votes[m.name] === '불참') absentCount++;
        });
        const rate = totalPastEvents > 0 ? (attendCount / totalPastEvents) * 100 : 0;
        return {
          name: m.name,
          role: m.role,
          count: attendCount,
          absent: absentCount,
          total: totalPastEvents,
          rate: rate
        };
      });

      rows.sort((a, b) => {
        if (b.rate !== a.rate) return b.rate - a.rate;
        if (b.count !== a.count) return b.count - a.count;
        return (a.name || '').localeCompare(b.name || '', 'ko');
      });

      let currentRank = 0;
      let prevRate = null;
      rows.forEach((r, i) => {
        if (prevRate === null || Math.round(r.rate) !== Math.round(prevRate)) {
          currentRank = i + 1;
          prevRate = r.rate;
        }
        r.rank = currentRank;
      });

      const avgRate = rows.length > 0
        ? rows.reduce((sum, r) => sum + r.rate, 0) / rows.length
        : 0;

      return { rows, totalPastEvents, avgRate };
    }

    /* [추가] 익명 건의사항 열람 권한 판별
       - 운영진: 전체 열람 가능 (단, 작성자 정보는 화면에 절대 표시하지 않음)
       - 일반 사용자: 본인이 작성한 건의사항만 열람 가능
       - 비로그인: 열람 불가 */
    function canViewSuggestion(s) {
      if (!currentUser) return false;
      if (currentUser.role === 'admin') return true;
      return !!(s && s.ownerKey && s.ownerKey === currentUser.name);
    }

    function isMySuggestion(s) {
      return !!(currentUser && s && s.ownerKey && s.ownerKey === currentUser.name);
    }

    /* ==================== [추가] 출석 독려 기능 모음 ==================== */
    /* ==================== [추가] 금일 운동 종료 (운영진 전용) ====================
       - 오늘 날짜의 정기운동에 finished:true 를 기록하면, 자정이 지나기 전에도
         '지난 운동'으로 취급되어 출석률·순위·연속 출석·칭호·MVP에 즉시 반영됩니다. */
    function isEventPast(e) {
      return e.date < getTodayString() || e.finished === true;
    }

    function isVoteDatePast(d) {
      return d < getTodayString() || sampleData.events.some(e => e.type === 'regular' && e.date === d && e.finished === true);
    }

    window.endTodayWorkout = async (eventId) => {
      if (!currentUser || currentUser.role !== 'admin') return alert('금일 운동 종료는 운영진만 가능합니다.');

      if (!evt) return alert('일정을 찾을 수 없습니다.');
      if (evt.date !== getTodayString()) return alert('오늘 날짜의 정기운동만 종료할 수 있습니다.');
      if (evt.finished) return alert('이미 종료된 운동입니다.');

      const votes = sampleData.regularVotesByDate[evt.date] || {};
      const attended = Object.values(votes).filter(v => v === '참가').length;
      const ok = confirm(
        `오늘(${evt.date}) ${evt.title}을(를) 종료하시겠습니까?\n\n` +

    /* 홈 정기운동 카드: 운영진에게만 보이는 종료 버튼 (오늘 운동일 때만) */

    /* 운영진 탭: 오늘의 정기운동 관리 카드 */
    function renderTodayWorkoutAdminCardHTML() {

                ${finished

                       <p class="text-[11px] text-emerald-800">참가 ${attend}명 기준으로 출석에 반영되었습니다.${evt.finishedBy ? ' (종료: ' + evt.finishedBy + ')' : ''}</p>
                       <button onclick="window.reopenTodayWorkout('${evt.id}')" class="text-[11px] bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 px-2.5 py-1 rounded-lg font-bold shrink-0">종료 취소</button>
                     </div>`
                  : `<button onclick="window.endTodayWorkout('${evt.id}')" class="w-full py-2.5 rounded-xl font-bold text-xs bg-rose-600 hover:bg-rose-700 text-white shadow-sm transition">🏁 금일 운동 종료</button>`}

      return `

          <p class="text-[11px] text-gray-400 mb-3 leading-relaxed">운동이 끝나면 종료 버튼을 눌러 주세요. 그 즉시 오늘 출석이 순위·연속 출석·칭호에 반영됩니다. (누르지 않으면 자정 이후 자동 반영)</p>
          <div class="space-y-2">${body}</div>
        </div>
      `;
    }
    /* ==================== [추가] 금일 운동 종료 끝 ==================== */

    const CHEER_MESSAGES = {
      '참가': ['오늘도 코트 접수하러 가자! 🏐', '참가 확인! 스파이크 연습해 오세요 💥', '당신 덕분에 코트가 꽉 차요 🙌', '좋아요! 네트 앞에서 만나요 🔥', '출석 도장 쾅! 👊'],
      '불참': ['다음엔 꼭 봬요 👋', '괜찮아요, 푹 쉬고 다음에 만나요 🍀', '몸 챙기시고 다음엔 코트에서 봐요 💪'],
      '미정': ['천천히 정해도 괜찮아요 🤔 정해지면 꼭 알려 주세요!']
    };

    function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    /* 하루 동안 같은 문구가 유지되도록(화면 갱신 시 깜빡임 방지) 날짜+키 기반으로 고정 선택 */
    function dailyPick(arr, key) {
      const str = getTodayString() + '|' + key;
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      return arr[h % arr.length];
    }

    let toastTimer = null;
    function showToast(msg, ms = 2400) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.innerText = msg;
      el.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), ms);
    }

    function setupReactionsListener() {
      onSnapshot(collection(db, "reactions"), (snapshot) => {
        const r = {};
        snapshot.docs.forEach(d => { r[d.id] = d.data().byUser || {}; });
        reactionsByDate = r;
        refreshCurrentTab();
      });
    }

    function getPastRegularEventsAsc() {
      const today = getTodayString();
      return sampleData.events
        .filter(e => e.type === 'regular' && isEventPast(e))
        .sort((a, b) => a.date.localeCompare(b.date));
    }

    /* 지난 정기운동 순서(오래된 순)대로 '참가'였는지 true/false 배열 */
    function getMemberHistory(name) {
      return getPastRegularEventsAsc().map(evt => ((sampleData.regularVotesByDate[evt.date] || {})[name] === '참가'));
    }

    /* 연속 출석 정보: 현재 연속, 최고 연속, 현재 연속 직전의 결석 구간 길이 */
    function getStreakInfo(name) {
      const hist = getMemberHistory(name);
      let current = 0;
      for (let i = hist.length - 1; i >= 0 && hist[i]; i--) current++;

      let best = 0, run = 0;
      hist.forEach(a => { run = a ? run + 1 : 0; if (run > best) best = run; });

      let gapBefore = 0, hadAttendBefore = false;
      if (current > 0) {
        let i = hist.length - current - 1;
        while (i >= 0 && !hist[i]) { gapBefore++; i--; }
        hadAttendBefore = i >= 0;
      }
      return { current, best, gapBefore, hadAttendBefore, total: hist.length };
    }

    /* 내 등수 + 앞/뒤 순위와의 격차 (기존 getAttendanceRanking 재사용) */
    function getMyRankInfo() {
      if (!currentUser) return null;
      const { rows, totalPastEvents } = getAttendanceRanking();
      const idx = rows.findIndex(r => r.name === currentUser.name);
      if (idx === -1) return { excluded: true };
      if (totalPastEvents === 0) return { empty: true };

      const me = rows[idx];
      const ahead = [...rows].reverse().find(r => r.count > me.count);
      const behind = rows.find(r => r.count < me.count);

      return {
        rank: me.rank,
        total: rows.length,
        count: me.count,
        played: totalPastEvents,
        tied: rows.filter(r => r.rank === me.rank).length > 1,
        aheadName: ahead ? ahead.name : null,
        gapAhead: ahead ? ahead.count - me.count : 0,
        gapBehind: behind ? me.count - behind.count : 0,
        isFirst: me.rank === 1
      };
    }

    function getRankMessage(info) {
      const key = currentUser ? currentUser.name : '';
      const g = info.gapAhead;
      const who = (SHOW_AHEAD_NAME && info.aheadName) ? `${info.aheadName}님` : '바로 앞 순위 회원';
      const topLimit = Math.ceil(info.total / 3);
      const bottomLimit = Math.floor(info.total * 2 / 3);

      if (info.count === 0) {
        return {
          title: '🏐 공이 외로워해요',
          text: g > 0
            ? dailyPick([
                `아직 코트에서 못 뵌 분... 공이 외로워하고 있어요 🏐 ${who}와 ${g}회 차이, 한 번만 나와도 순위가 쑥 올라가요!`,
                `네트가 당신을 기다리고 있어요 🥺 ${who}까지 ${g}회, 이번 운동이 첫걸음이에요!`
              ], key)
            : '모두가 아직 0회! 먼저 코트에 오는 분이 선두예요 🏃'
        };
      }
      if (info.isFirst) {
        return {
          title: '👑 출석왕',
          text: info.gapBehind > 0
            ? dailyPick([
                `왕관이 무겁진 않으세요? 뒤에서 ${info.gapBehind}회 차로 추격 중이에요 👀`,
                `1등의 품격 ✨ 하지만 ${info.gapBehind}회 차로 쫓기는 중, 방심은 금물!`
              ], key)
            : '공동 선두! 왕관을 나눠 쓰는 중이에요 👑👑'
        };
      }
      if (info.rank <= topLimit) {
        return {
          title: `🏃 ${info.rank}등, 선두권!`,
          text: dailyPick([
            `${who}와 딱 ${g}회 차이! 이번 운동에 나오면 추월 각이에요 🚀`,
            `${g}회만 더 나오면 한 계단 위! 포디움이 코앞이에요 🥇`
          ], key)
        };
      }
      if (info.rank > bottomLimit) {
        return {
          title: `🌱 ${info.rank}등, 성장 중`,
          text: dailyPick([
            `네트가 당신을 기다리고 있어요 🥺 ${who}와 ${g}회 차이, 지금부터 충분히 따라잡을 수 있어요!`,
            `코트가 그리웠어요 🏐 ${g}회만 나와도 순위가 확 올라가요!`
          ], key)
        };
      }
      return {
        title: `🏃 ${info.rank}등`,
        text: dailyPick([
          `${who}와 ${g}회 차이, 이번 주만 나오면 역전이에요 💪`,
          `딱 ${g}회! 한 번만 더 나오면 추월입니다 😎`
        ], key)
      };
    }

    function getStreakLineHTML(nextEvt) {
      if (!currentUser) return '';
      const st = getStreakInfo(currentUser.name);
      if (st.total === 0) return '';
      const nextLabel = nextEvt ? `${nextEvt.date.substring(5)} 운동에` : '다음 운동에';
      let text;
      if (st.current >= 1) {
        text = `🔥 <strong>${st.current}연속</strong> 출석 중! ${nextLabel} 오시면 ${st.current + 1}연속!`;

      } else {
        text = `🌱 연속 기록이 0이에요. ${nextLabel} 오시면 새 스트릭이 시작돼요!`;
        if (st.best > 0) text += ` <span class="text-gray-400">(최고 기록 ${st.best}연속)</span>`;
      }
      return `<p class="text-[11px] sm:text-xs text-gray-700 bg-rose-50 border border-rose-100 rounded-xl px-3 py-2 mt-3 leading-relaxed">${text}</p>`;
    }

    /* 홈: 내 등수 + 앞 순위와의 격차 카드 */
    function renderMyRankCardHTML(nextEvt) {
      const wrap = (inner) => `<section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 mb-5">${inner}</section>`;

            : '지금은 쉬는 중이시네요. 돌아오시면 환영 박수 준비해 둘게요 👏'}</p>

      if (info.gapBehind > 0) chips.push(`<span class="text-[11px] font-bold bg-gray-100 text-gray-700 border border-gray-200 px-2 py-1 rounded-lg">⬇️ 뒤 순위와 ${info.gapBehind}회 차이</span>`);
      if (info.isFirst && info.gapBehind === 0) chips.push(`<span class="text-[11px] font-bold bg-amber-50 text-amber-800 border border-amber-200 px-2 py-1 rounded-lg">👑 선두</span>`);

      return wrap(`
        <div class="flex items-center gap-3 sm:gap-4">
          <div class="text-center shrink-0 bg-indigo-950 text-white rounded-2xl px-3 py-2.5 min-w-[72px]">
            <span class="text-[10px] text-indigo-200 block">${info.tied ? '공동' : '나의 등수'}</span>
            <span class="text-2xl font-black text-amber-400 leading-none">${info.rank}<span class="text-sm">등</span></span>
            <span class="text-[10px] text-indigo-200 block mt-0.5">/ ${info.total}명</span>
          </div>
          <div class="min-w-0 flex-1">
            <h2 class="text-sm sm:text-base font-black text-gray-900 mb-1">${msg.title}</h2>
            <p class="text-xs text-gray-600 leading-relaxed">${msg.text}</p>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-1.5 mt-3">
          <span class="text-[11px] font-bold bg-emerald-50 text-emerald-800 border border-emerald-100 px-2 py-1 rounded-lg">나의 출석 ${info.count}/${info.played}회</span>
          ${chips.join('')}
        </div>
        ${getStreakLineHTML(nextEvt)}
      `);
    }

    /* 홈: 다음 정기운동 '미정' 알림 배너 */
    function renderPendingBannerHTML(nextEvt) {

    /* 정기운동 카드: 풀코트 인원 게이지 */
    function renderFullCourtGaugeHTML(attendCount, myStatus) {
      const pct = Math.min(100, (attendCount / FULL_COURT_COUNT) * 100);
      const remain = Math.max(0, FULL_COURT_COUNT - attendCount);
      let msg;
      if (remain === 0) msg = `🎉 풀코트 완성! ${attendCount}명 확정, 코트가 꽉 찹니다`;
      else if (attendCount === 0) msg = '🏐 아직 확정 0명! 첫 번째 주인공이 되어 주세요';
      else if (remain <= 3) msg = `🔥 ${attendCount}명 확정, ${remain}명만 더 오면 풀코트!`;
      else msg = `${attendCount}명 확정, 풀코트까지 ${remain}명 남았어요`;
      if (remain > 0 && currentUser && myStatus !== '참가') msg += ' · 당신이 필요해요 🙋';

      const barColor = remain === 0 ? 'bg-emerald-500' : remain <= 3 ? 'bg-amber-400' : 'bg-indigo-500';
      return `
        <div class="mb-3">
          <div class="flex justify-between items-center text-[11px] font-bold mb-1">
            <span class="text-indigo-900">🏐 풀코트 게이지</span>
            <span class="text-gray-500">${Math.min(attendCount, FULL_COURT_COUNT)} / ${FULL_COURT_COUNT}명</span>
          </div>
          <div class="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden">
            <div style="width: ${pct}%" class="${barColor} h-full rounded-full transition-all"></div>
          </div>
          <p class="text-[11px] text-gray-600 mt-1.5 leading-relaxed">${msg}</p>
        </div>
      `;
    }

    /* 홈: 지난 운동 후기(이모지 반응) 카드 - 최근 7일 이내 정기운동 */
    function renderReactionCardHTML() {
      const past = getPastRegularEventsAsc();
      if (past.length === 0) return '';
      const last = past[past.length - 1];
      const diffDays = Math.round((new Date(getTodayString()) - new Date(last.date)) / 86400000);
      if (diffDays > 7) return '';

      const votes = sampleData.regularVotesByDate[last.date] || {};
      const attended = Object.values(votes).filter(v => v === '참가').length;
      const byUser = reactionsByDate[last.date] || {};
      const myReact = currentUser ? byUser[currentUser.name] : null;
      const myAttended = !!(currentUser && votes[currentUser.name] === '참가');

      const counts = {};
      Object.values(byUser).forEach(e => { counts[e] = (counts[e] || 0) + 1; });

      const when = diffDays === 0 ? '오늘' : diffDays === 1 ? '어제' : last.date.substring(5);
      let fomo = '';
      if (attended > 0) {
        fomo = `🏐 ${attended}명이 코트를 달궜어요. `;
        fomo += (currentUser && !myAttended) ? '다음엔 같이 뛰어요! 😢 버튼도 환영이에요' : '오늘의 소감을 남겨 주세요!';
      }

      return `
        <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100">
          <h2 class="text-sm sm:text-base font-black text-gray-900 mb-1">💬 ${when} 운동 어땠나요?</h2>
          <p class="text-[11px] text-gray-500 mb-3 leading-relaxed">${last.date} ${last.title}${fomo ? ' · ' + fomo : ''}</p>
          <div class="grid grid-cols-5 gap-1.5">
            ${REACTION_OPTIONS.map(o => `
              <button onclick="window.toggleReaction('${last.date}', '${o.emoji}')" class="flex flex-col items-center py-2 rounded-xl border text-[10px] font-bold transition ${myReact === o.emoji ? 'bg-indigo-950 text-white border-indigo-950' : 'bg-gray-50 text-gray-700 border-gray-200 hover:bg-indigo-50'}">
                <span class="text-lg leading-none mb-0.5">${o.emoji}</span>
                <span class="leading-tight text-center">${o.label}</span>
                <span class="mt-0.5 ${myReact === o.emoji ? 'text-amber-300' : 'text-gray-400'}">${counts[o.emoji] || 0}</span>
              </button>
            `).join('')}
          </div>
        </section>
      `;
    }

    window.toggleReaction = async (dateKey, emoji) => {
      if (!currentUser) return window.openLoginModal();
      const byUser = { ...(reactionsByDate[dateKey] || {}) };
      const removing = byUser[currentUser.name] === emoji;
      if (removing) delete byUser[currentUser.name];
      else byUser[currentUser.name] = emoji;

      try {
        await setDoc(doc(db, "reactions", dateKey), { byUser });
        if (!removing) showToast('소감이 등록되었어요 ' + emoji);
      } catch (err) {
        console.error(err);
        alert('반응 등록 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
      }
    };

    /* 홈: 이달의 MVP (칭찬 위주, 하위권은 절대 노출하지 않음) */
    function renderMvpCardHTML() {
      const monthPrefix = getTodayString().substring(0, 7);
      const monthEvents = getPastRegularEventsAsc().filter(e => e.date.startsWith(monthPrefix));
      if (monthEvents.length === 0) return '';

      const targets = sampleData.members.filter(m => m.role === 'admin' || m.role === 'member');
      if (targets.length === 0) return '';

      const scored = targets.map(m => ({
        name: m.name,
        count: monthEvents.filter(e => ((sampleData.regularVotesByDate[e.date] || {})[m.name]) === '참가').length
      }));
      const max = Math.max(...scored.map(r => r.count));
      if (max === 0) return '';

      const mvps = scored.filter(r => r.count === max).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
      const perfect = max === monthEvents.length;
      const shown = mvps.slice(0, 8);
      const rest = mvps.length - shown.length;
      const monthNum = parseInt(getTodayString().substring(5, 7), 10);

      return `
        <section class="bg-gradient-to-r from-amber-50 to-yellow-50 p-4 sm:p-5 rounded-2xl shadow-sm border border-amber-200">
          <div class="flex justify-between items-center mb-2 flex-wrap gap-1">
            <h2 class="text-sm sm:text-base font-black text-amber-900">🏅 ${monthNum}월 MVP</h2>
            <span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">정기운동 ${monthEvents.length}회 중 ${perfect ? '개근' : max + '회 참석'}</span>
          </div>
          <div class="flex flex-wrap gap-1.5 mb-2">
            ${shown.map(r => `<span class="text-xs font-bold bg-white text-amber-900 border border-amber-200 px-2.5 py-1 rounded-full shadow-sm">🏅 ${r.name}</span>`).join('')}
            ${rest > 0 ? `<span class="text-xs font-bold text-amber-800 px-1 py-1">외 ${rest}명</span>` : ''}
          </div>
          <p class="text-[11px] text-amber-800 leading-relaxed">${perfect ? '개근 달성! 이분들 덕분에 코트가 살아 있어요 👏' : '이달 가장 열심히 코트를 지킨 분들이에요 👏'}</p>
        </section>
      `;
    }

    /* 나의 정보: 칭호/배지 */
    function getMemberBadges(name) {
      const hist = getMemberHistory(name);
      const total = hist.length;
      const count = hist.filter(Boolean).length;
      const rate = total > 0 ? (count / total) * 100 : 0;
      const st = getStreakInfo(name);
      const rankRow = getAttendanceRanking().rows.find(r => r.name === name);

      const monthPrefix = getTodayString().substring(0, 7);
      const monthEvents = getPastRegularEventsAsc().filter(e => e.date.startsWith(monthPrefix));
      const monthAttend = monthEvents.filter(e => ((sampleData.regularVotesByDate[e.date] || {})[name]) === '참가').length;

      return [
        { icon: '🏐', name: '첫 출석', desc: '정기운동에 처음 참가했어요', earned: count >= 1 },
        { icon: '🔥', name: '불꽃 스트릭', desc: '3회 연속 출석 달성', earned: st.best >= 3 },
        { icon: '🏅', name: '이달의 개근', desc: '이번 달 정기운동 개근 (2회 이상 열린 경우)', earned: monthEvents.length >= 2 && monthAttend === monthEvents.length },
        { icon: '🧚', name: '출석 요정', desc: '5회 이상 집계 중 출석률 80% 이상', earned: total >= 5 && rate >= 80 },
        { icon: '👑', name: '출석왕', desc: '출석률 1등 (3회 이상 집계 시)', earned: !!rankRow && total >= 3 && rankRow.rank === 1 && count > 0 },
        { icon: '💯', name: '10회 출석 클럽', desc: '누적 10회 출석', earned: count >= 10 },
        { icon: '🦸', name: '컴백 히어로', desc: '3회 이상 쉬다가 다시 출석', earned: st.current >= 1 && st.current <= 2 && st.gapBefore >= 3 && st.hadAttendBefore }
      ];
    }

    function renderBadgesCardHTML(name) {
      const badges = getMemberBadges(name);
      const earnedCount = badges.filter(b => b.earned).length;
      return `
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
          <h3 class="text-xs sm:text-sm font-black text-gray-900 mb-1 flex items-center gap-1.5"><span>🎖️</span> 나의 칭호 (${earnedCount}/${badges.length})</h3>
          <p class="text-[11px] text-gray-400 mb-3">정기운동 출석 기록에 따라 자동으로 획득돼요.</p>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
            ${badges.map(b => `
              <div class="p-2.5 rounded-xl border text-center ${b.earned ? 'bg-amber-50 border-amber-200' : 'bg-gray-50 border-gray-100 opacity-50'}">
                <div class="text-2xl mb-0.5 ${b.earned ? '' : 'grayscale'}">${b.icon}</div>
                <div class="text-xs font-black ${b.earned ? 'text-amber-900' : 'text-gray-500'}">${b.name}</div>
                <div class="text-[10px] leading-snug mt-0.5 ${b.earned ? 'text-amber-800' : 'text-gray-400'}">${b.desc}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }
    /* [추가] 운영진 탭: 운동 후기(이모지 반응) 기록 - 날짜별 누적 보관, 홈 카드가 사라진 뒤에도 계속 확인 가능 */
    function renderAdminReactionLogHTML() {
      const dates = Object.keys(reactionsByDate)
        .filter(d => Object.keys(reactionsByDate[d] || {}).length > 0)
        .sort((a, b) => b.localeCompare(a));

      const pageSize = 3;
      const maxPage = Math.max(1, Math.ceil(dates.length / pageSize));
      if (pageState.adminReactions > maxPage) pageState.adminReactions = maxPage;
      const paged = paginate(dates, pageSize, pageState.adminReactions);

      const totalReactions = dates.reduce((sum, d) => sum + Object.keys(reactionsByDate[d]).length, 0);

      const cards = paged.map(d => {
        const byUser = reactionsByDate[d] || {};
        const evt = sampleData.events.find(e => e.type === 'regular' && e.date === d);
        const votes = sampleData.regularVotesByDate[d] || {};
        const attended = Object.values(votes).filter(v => v === '참가').length;
        const reactedCount = Object.keys(byUser).length;

        const rows = REACTION_OPTIONS.map(o => {
          const names = Object.keys(byUser).filter(n => byUser[n] === o.emoji).sort((a, b) => a.localeCompare(b, 'ko'));
          if (names.length === 0) return '';
          return `
            <div class="flex items-start gap-2 text-xs">
              <div class="shrink-0 w-24 font-bold text-gray-700">${o.emoji} ${o.label} <span class="text-indigo-900">${names.length}</span></div>
              <div class="flex flex-wrap gap-1 min-w-0">
                ${names.map(n => `<span class="text-[10px] bg-white border border-gray-200 text-gray-600 px-1.5 py-0.5 rounded">${n}</span>`).join('')}
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="p-3 bg-gray-50 rounded-xl space-y-2">
            <div class="flex justify-between items-center flex-wrap gap-1">
              <span class="text-xs font-black text-indigo-950">${d} ${evt ? evt.title : '정기운동'}</span>
              <span class="text-[10px] font-bold bg-white border border-gray-200 text-gray-600 px-2 py-0.5 rounded-full">참가 ${attended}명 · 반응 ${reactedCount}명</span>
            </div>
            ${rows}
          </div>
        `;
      }).join('');

      return `
        <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100">
          <div class="flex justify-between items-start mb-1 flex-wrap gap-2">
            <h3 class="text-xs sm:text-sm font-black text-gray-900 flex items-center gap-1.5"><span>💬</span> 운동 후기 기록</h3>
            <span class="text-[10px] font-bold bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full shrink-0">총 ${dates.length}회 · 반응 ${totalReactions}건</span>
          </div>
          <p class="text-[11px] text-gray-400 mb-3 leading-relaxed">홈 화면의 "운동 어땠나요?"에 회원들이 남긴 반응이 날짜별로 보관됩니다. 😅·😢 반응이 많은 날은 운영 방식을 점검해 보세요.</p>
          <div class="space-y-2 min-h-[120px]">
            ${dates.length === 0 ? '<p class="text-xs text-gray-400 py-8 text-center">아직 남겨진 후기 반응이 없습니다.</p>' : cards}
          </div>
          ${renderPaginationUI(dates.length, pageSize, pageState.adminReactions, 'changeAdminReactionsPage')}
        </div>
      `;
    }
    /* ==================== [추가] 끝 ==================== */

    let renderTimer = null;
    function refreshCurrentTab() {
      calculateAttendanceStats();
      if (renderTimer) clearTimeout(renderTimer);
      renderTimer = setTimeout(() => {
        const app = document.getElementById('app');
        renderHeader();
        if (currentTab === 'home') renderHome(app);
        else if (currentTab === 'calendar') renderCalendarTab(app);
        else if (currentTab === 'board') renderBoardTab(app);
        else if (currentTab === 'myinfo') renderMyInfoTab(app);
        else if (currentTab === 'admin') renderAdminTab(app);
      }, 50);
    }

    function setupFirestoreListeners() {
      onSnapshot(collection(db, "members"), (snapshot) => {
        sampleData.members = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (currentUser) {
          const updatedSelf = sampleData.members.find(m => m.name === currentUser.name);
          if (updatedSelf) {
            currentUser.role = updatedSelf.role;
            if (localStorage.getItem('vega_user')) localStorage.setItem('vega_user', JSON.stringify(currentUser));
            else sessionStorage.setItem('vega_user', JSON.stringify(currentUser));
          }
        }
        refreshCurrentTab();
      });

      onSnapshot(collection(db, "posts"), (snapshot) => {
        sampleData.boardPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        refreshCurrentTab();
      });

      onSnapshot(collection(db, "comments"), (snapshot) => {
        sampleData.comments = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (currentViewingPostId) renderPostComments(currentViewingPostId);
        if (currentTab === 'myinfo') renderMyInfoTab(document.getElementById('app'));
      });

      onSnapshot(collection(db, "suggestions"), (snapshot) => {
        sampleData.suggestions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        refreshCurrentTab();
      });

      onSnapshot(collection(db, "events"), (snapshot) => {
        sampleData.events = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const today = getTodayString();
        const regularEvents = sampleData.events.filter(e => e.type === 'regular' && !isEventPast(e)).sort((a, b) => a.date.localeCompare(b.date));
        if (regularEvents.length > 0 && (!selectedHomeDate || !regularEvents.some(e => e.date === selectedHomeDate))) {
          selectedHomeDate = regularEvents[0].date;
        }
        if (regularEvents.length > 0 && (!selectedAdminDate || !regularEvents.some(e => e.date === selectedAdminDate))) {
          selectedAdminDate = regularEvents[0].date;
        }
        refreshCurrentTab();
      });

      onSnapshot(collection(db, "regularVotes"), (snapshot) => {
        const votes = {};
        snapshot.docs.forEach(doc => { votes[doc.id] = doc.data().votes || {}; });
        sampleData.regularVotesByDate = votes;
        refreshCurrentTab();
      });

    }

    setupFirestoreListeners();
    setupReactionsListener();

    function paginate(array, pageSize, pageNumber) {
      return array.slice((pageNumber - 1) * pageSize, pageNumber * pageSize);
    }

    /* 수정사항 2: 페이지네이션 숫자 5개 고정 노출 및 맨앞/맨뒤 이동 버튼 기능 추가 */
    function renderPaginationUI(totalItems, pageSize, currentPage, onPageChangeFnName) {
      const totalPages = Math.ceil(totalItems / pageSize);
      if (totalPages <= 1) return '';

      const maxPagesToShow = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxPagesToShow / 2));
      let endPage = startPage + maxPagesToShow - 1;

      if (endPage > totalPages) {
        endPage = totalPages;
        startPage = Math.max(1, endPage - maxPagesToShow + 1);
      }

      let pageBtns = '';
      for (let i = startPage; i <= endPage; i++) {
        const isActive = i === currentPage;
        pageBtns += `
          <button onclick="window.${onPageChangeFnName}(${i})" class="w-7 h-7 text-xs font-bold rounded-lg transition ${isActive ? 'bg-indigo-950 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
            ${i}
          </button>
        `;
      }

      return `
        <div class="flex items-center justify-center gap-1 pt-4 border-t border-gray-100 mt-3">
          <button onclick="window.${onPageChangeFnName}(1)" ${currentPage === 1 ? 'disabled class="opacity-30 cursor-not-allowed text-xs px-1.5 py-1 font-bold text-gray-500"' : 'class="text-xs px-1.5 py-1 font-bold text-indigo-900 hover:bg-gray-100 rounded"'} title="맨앞으로">
            &laquo;
          </button>
          <button onclick="window.${onPageChangeFnName}(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="opacity-30 cursor-not-allowed text-xs px-1.5 py-1 font-bold text-gray-500"' : 'class="text-xs px-1.5 py-1 font-bold text-indigo-900 hover:bg-gray-100 rounded"'}>
            이전
          </button>
          <div class="flex items-center gap-1">${pageBtns}</div>
          <button onclick="window.${onPageChangeFnName}(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="opacity-30 cursor-not-allowed text-xs px-1.5 py-1 font-bold text-gray-500"' : 'class="text-xs px-1.5 py-1 font-bold text-indigo-900 hover:bg-gray-100 rounded"'}>
            다음
          </button>
          <button onclick="window.${onPageChangeFnName}(${totalPages})" ${currentPage === totalPages ? 'disabled class="opacity-30 cursor-not-allowed text-xs px-1.5 py-1 font-bold text-gray-500"' : 'class="text-xs px-1.5 py-1 font-bold text-indigo-900 hover:bg-gray-100 rounded"'} title="맨뒤로">
            &raquo;
          </button>
        </div>
      `;
    }

    function renderHeader() {
      const headerArea = document.getElementById('userHeaderArea');
      if (currentUser) {
        headerArea.innerHTML = `
          <div class="flex items-center gap-1.5">
            <span class="text-[10px] sm:text-xs bg-indigo-800 text-indigo-200 px-1.5 sm:px-2 py-0.5 rounded-md font-bold shrink-0">${roleLabels[currentUser.role] || '회원'}</span>
            <span class="text-xs sm:text-sm font-bold truncate max-w-[80px] sm:max-w-none">${currentUser.name}님</span>
          </div>
          <button onclick="window.handleLogout()" class="text-xs text-gray-300 hover:text-white underline shrink-0 ml-1">로그아웃</button>
        `;
      } else {
        headerArea.innerHTML = `
          <button onclick="window.openLoginModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg transition shrink-0">로그인</button>
        `;
      }
    }

    window.openLoginModal = () => document.getElementById('loginModal').classList.remove('hidden');
    window.closeLoginModal = () => document.getElementById('loginModal').classList.add('hidden');
    
    window.openPasswordModal = (isForced = false) => {
      const modal = document.getElementById('passwordModal');
      const desc = document.getElementById('passwordModalDesc');
      const cancelBtn = document.getElementById('passModalCancelBtn');
      
      if (isForced) {
        isMustChangePassword = true;
        desc.innerText = "초기 비밀번호(0000)를 사용 중입니다. 비밀번호를 변경하셔야 이용이 가능합니다.";
        cancelBtn.classList.add('hidden');
      } else {
        isMustChangePassword = false;
        desc.innerText = "새롭게 사용하실 4자리 비밀번호를 입력해 주세요.";
        cancelBtn.classList.remove('hidden');
      }
      modal.classList.remove('hidden');
    };
    
    window.closePasswordModal = () => {
      if (isMustChangePassword) {
        alert("초기 비밀번호를 변경해 주셔야 정상 이용이 가능합니다.");
        return;
      }
      document.getElementById('passwordModal').classList.add('hidden');
    };

    window.handleLogin = async (e) => {
      e.preventDefault();
      const name = document.getElementById('loginName').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const remember = document.getElementById('rememberMe').checked;

      const userDocRef = doc(db, "members", name);
      const userDocSnap = await getDoc(userDocRef);

      let role = (name === "운영진" || name === "회장") ? "admin" : "member";
      let correctPass = "0000";

      if (userDocSnap.exists()) {
        const data = userDocSnap.data();
        role = data.role || role;
        correctPass = data.password || "0000";
      } else {
        await setDoc(userDocRef, { name: name, role: role, password: "0000" });
      }

      if (pass !== correctPass) {
        return alert('비밀번호가 일치하지 않습니다.');
      }

      currentUser = { name: name, role: role };
      
      if (remember) {
        localStorage.setItem('vega_user', JSON.stringify(currentUser));
        sessionStorage.removeItem('vega_user');
      } else {
        sessionStorage.setItem('vega_user', JSON.stringify(currentUser));
        localStorage.removeItem('vega_user');
      }

      window.closeLoginModal();
      renderHeader();

      if (correctPass === "0000") {
        window.openPasswordModal(true);
      } else {
        switchTab(currentTab);
      }
    };

    window.handleLogout = () => {
      if(confirm("로그아웃 하시겠습니까?")) {
        localStorage.removeItem('vega_user');
        sessionStorage.removeItem('vega_user');
        currentUser = null;
        renderHeader();
        switchTab('home');
      }
    };

    window.handleChangePassword = async (e) => {
      e.preventDefault();
      const newPass = document.getElementById('newPass').value;
      if (newPass.length !== 4) return alert('비밀번호는 4자리 숫자로 입력해 주세요.');
      if (newPass === "0000") return alert('기본 비밀번호(0000) 이외의 새 비밀번호를 설정해 주세요.');
      
      if (currentUser) {
        await setDoc(doc(db, "members", currentUser.name), {
          name: currentUser.name,
          role: currentUser.role,
          password: newPass
        }, { merge: true });
      }
      alert('비밀번호가 성공적으로 변경되었습니다.');
      isMustChangePassword = false;
      document.getElementById('passwordModal').classList.add('hidden');
      switchTab(currentTab);
    };

    window.switchTab = (tabName, categoryName) => {
      currentTab = tabName;
      ['home', 'calendar', 'board', 'myinfo', 'admin'].forEach(tab => {
        const btn = document.getElementById(`nav-${tab}`);
        btn.className = (tab === tabName) 
          ? "flex flex-col items-center text-[10px] sm:text-xs font-bold text-indigo-900" 
          : "flex flex-col items-center text-[10px] sm:text-xs font-bold text-gray-400 hover:text-indigo-900";
      });

      if(categoryName) currentBoardCategory = categoryName;

      const app = document.getElementById('app');
      if (tabName === 'home') renderHome(app);

       가장 긴 글자도 잘리지 않도록 전체 크기를 함께 줄여준다.
       최소 크기(6px)까지 줄여도 넘치면 줄바꿈으로 전환하여 끝까지 보이게 한다. */
    function fitAllCalendarEvents(calendarEl) {
      if (!calendarEl) return;
      const targets = Array.from(calendarEl.querySelectorAll('.fc-event-title, .holiday-name-label'));
      if (targets.length === 0) return;
      if (calendarEl.clientWidth === 0) return; // 탭이 보이지 않을 때는 측정 불가

      const maxFont = 11;
      const minFont = 6;
      calendarEl.classList.remove('fc-wrap-mode');

      const applySize = (px) => targets.forEach(el => el.style.setProperty('font-size', px + 'px', 'important'));
      const isClipped = () => targets.some(el => el.clientWidth > 0 && el.scrollWidth > el.clientWidth + 1);

      let size = maxFont;
      applySize(size);
      let guard = 0;
      while (isClipped() && size > minFont && guard < 30) {
        size -= 0.5;
        applySize(size);
        guard++;
      }
      if (isClipped()) calendarEl.classList.add('fc-wrap-mode');
    }

    let calendarFitTimer = null;
    function scheduleCalendarFit(calendarEl) {
      if (calendarFitTimer) clearTimeout(calendarFitTimer);
      calendarFitTimer = setTimeout(() => {
        requestAnimationFrame(() => requestAnimationFrame(() => fitAllCalendarEvents(calendarEl)));
      }, 30);
    }

          <div id="calendar" class="w-full"></div>

      setTimeout(() => {

    function compressImageFile(file, maxDimension = 1000, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDimension || height > maxDimension) {
              const scale = Math.min(maxDimension / width, maxDimension / height);
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
