<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>순천 VEGA 배구동호회</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <style>
    .fc-day-sat .fc-col-header-cell-cushion,
    .fc-day-sat .fc-daygrid-day-number { color: #2563eb !important; font-weight: bold; }
    .fc-day-sun .fc-col-header-cell-cushion,
    .fc-day-sun .fc-daygrid-day-number { color: #dc2626 !important; font-weight: bold; }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 pb-24 md:pb-8">

  <!-- ==================== Header ==================== -->
  <header class="bg-indigo-950 text-white p-4 shadow-md fixed top-0 left-0 right-0 z-50 flex justify-between items-center h-16">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🏐</span>
      <h1 class="text-xl font-black tracking-wider cursor-pointer" onclick="switchTab('home')">순천 VEGA</h1>
    </div>
    <div id="userHeaderArea" class="flex items-center gap-3"></div>
  </header>

  <!-- ==================== Navigation Bar ==================== -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-2 z-40 md:top-16 md:bottom-auto md:border-b md:border-t-0 md:justify-center md:gap-12 shadow-md h-14 md:h-12 items-center">
    <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-xs font-bold text-indigo-900">
      <span class="text-base md:text-sm">🏠</span> 홈
    </button>
    <button onclick="switchTab('calendar')" id="nav-calendar" class="flex flex-col items-center text-xs font-bold text-gray-400 hover:text-indigo-900">
      <span class="text-base md:text-sm">📅</span> 일정
    </button>
    <button onclick="switchTab('board')" id="nav-board" class="flex flex-col items-center text-xs font-bold text-gray-400 hover:text-indigo-900">
      <span class="text-base md:text-sm">📋</span> 게시판
    </button>
    <button onclick="switchTab('myinfo')" id="nav-myinfo" class="flex flex-col items-center text-xs font-bold text-gray-400 hover:text-indigo-900">
      <span class="text-base md:text-sm">👤</span> 나의 정보
    </button>
    <button onclick="switchTab('admin')" id="nav-admin" class="flex flex-col items-center text-xs font-bold text-gray-400 hover:text-indigo-900">
      <span class="text-base md:text-sm">⚙️</span> 운영진
    </button>
  </nav>

  <!-- ==================== Main Content ==================== -->
  <main id="app" class="max-w-5xl mx-auto p-4 mt-20 md:mt-32 min-h-[80vh]"></main>

  <!-- ==================== Modals ==================== -->
  <!-- 로그인 모달 -->
  <div id="loginModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <h2 class="text-2xl font-black text-indigo-950 mb-1 text-center">순천 VEGA 로그인</h2>
      <p class="text-xs text-gray-500 mb-6 text-center">이름과 비밀번호 4자리를 입력하세요.</p>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">이름</label>
          <input type="text" id="loginName" required placeholder="예: 홍길동 (운영진 접속: 회장)" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:outline-none text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">비밀번호 (초기: 0000)</label>
          <input type="password" id="loginPass" maxlength="4" required placeholder="숫자 4자리" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:outline-none text-sm" />
        </div>
        <button type="submit" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-3 rounded-xl transition shadow-md">로그인</button>
      </form>
    </div>
  </div>

  <!-- 비밀번호 변경 모달 -->
  <div id="passwordModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <h2 class="text-xl font-black text-indigo-950 mb-4 text-center">비밀번호 변경</h2>
      <form onsubmit="handleChangePassword(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">새 비밀번호 (4자리)</label>
          <input type="password" id="newPass" maxlength="4" required placeholder="숫자 4자리" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-600 text-sm" />
        </div>
        <div class="flex gap-2">
          <button type="button" onclick="closePasswordModal()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-xs">취소</button>
          <button type="submit" class="w-1/2 bg-indigo-900 text-white font-bold py-2.5 rounded-xl text-xs">변경하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 투표 현황 모달 -->
  <div id="voteStatusModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl relative max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 pb-3 border-b">
        <h2 id="voteModalTitle" class="text-base font-black text-indigo-950 truncate pr-2">투표 현황</h2>
        <button onclick="closeVoteModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <div id="voteModalContent" class="space-y-4 overflow-y-auto text-xs pr-1"></div>
      <button onclick="closeVoteModal()" class="mt-4 w-full bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl text-xs">닫기</button>
    </div>
  </div>

  <!-- 일정 상세 모달 -->
  <div id="eventDetailModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <div class="flex justify-between items-center mb-3 pb-2 border-b">
        <span id="eventCategoryBadge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-900">일정</span>
        <button onclick="closeEventDetailModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <h3 id="eventDetailTitle" class="text-lg font-black text-indigo-950 mb-3">일정 제목</h3>
      <div class="space-y-2 text-xs text-gray-600 mb-5 bg-gray-50 p-3 rounded-xl border border-gray-100">
        <p class="flex items-center gap-2"><span class="font-bold text-gray-800 w-12">📅 일시:</span> <span id="eventDetailTime"></span></p>
        <p class="flex items-center gap-2"><span class="font-bold text-gray-800 w-12">📍 장소:</span> <span id="eventDetailLocation"></span></p>
        <div class="pt-2 border-t border-gray-200 mt-2">
          <p class="font-bold text-gray-800 mb-1">📝 상세 내용:</p>
          <p id="eventDetailDesc" class="text-gray-600 whitespace-pre-line leading-relaxed"></p>
        </div>
      </div>
      <button onclick="closeEventDetailModal()" class="w-full bg-indigo-950 text-white font-bold py-2.5 rounded-xl text-xs">확인</button>
    </div>
  </div>

  <!-- 게시글 작성 모달 -->
  <div id="writePostModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 pb-2 border-b">
        <h3 id="writeModalTitle" class="text-base font-black text-indigo-950">새 게시글 작성</h3>
        <button onclick="closeWritePostModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <form onsubmit="handleCreatePost(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">카테고리</label>
          <select id="postCategorySelect" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs bg-white">
            <option value="자유게시판">자유게시판</option>
            <option value="공지사항">공지사항</option>
            <option value="영상게시판">영상게시판</option>
            <option value="🔒 익명 건의사항">🔒 익명 건의사항</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">제목</label>
          <input type="text" id="postTitleInput" required placeholder="제목을 입력하세요" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">내용</label>
          <textarea id="postContentInput" rows="4" required placeholder="내용을 입력하세요" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">📷 이미지 첨부</label>
          <input type="file" id="postImageInput" accept="image/*" onchange="previewImage(event)" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-900 hover:file:bg-indigo-100" />
          <div id="imagePreviewContainer" class="mt-2 hidden">
            <img id="imagePreview" src="" alt="미리보기" class="w-full max-h-40 object-cover rounded-xl border border-gray-200" />
          </div>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeWritePostModal()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-xs">취소</button>
          <button type="submit" class="w-1/2 bg-indigo-950 text-white font-bold py-2.5 rounded-xl text-xs">등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 게시글 상세 조회 모달 -->
  <div id="postDetailModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg shadow-2xl relative max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-3 pb-2 border-b">
        <span id="postDetailCategory" class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-900"></span>
        <button onclick="closePostDetailModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <div class="overflow-y-auto pr-1 space-y-4 flex-1">
        <div>
          <h3 id="postDetailTitle" class="text-base font-black text-gray-900 mb-1"></h3>
          <div class="flex items-center justify-between text-[11px] text-gray-400 border-b border-gray-100 pb-2">
            <span id="postDetailAuthor" class="font-bold text-indigo-900"></span>
            <span id="postDetailDate"></span>
          </div>
        </div>
        <div id="postDetailImageContainer" class="hidden">
          <img id="postDetailImage" src="" class="w-full rounded-xl object-cover max-h-60 border border-gray-100 shadow-sm" />
        </div>
        <p id="postDetailContent" class="text-xs text-gray-700 leading-relaxed whitespace-pre-line bg-gray-50 p-3 rounded-xl border border-gray-100"></p>
        
        <!-- 댓글 영역 -->
        <div class="pt-3 border-t border-gray-100">
          <h4 class="text-xs font-bold text-gray-900 mb-2">💬 댓글 목록</h4>
          <div id="postCommentsList" class="space-y-2 mb-3"></div>
          <form onsubmit="handleAddComment(event)" class="flex gap-2">
            <input type="text" id="commentInput" required placeholder="댓글을 입력하세요..." class="flex-1 p-2 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
            <button type="submit" class="bg-indigo-900 text-white px-3 py-2 rounded-xl text-xs font-bold shrink-0">작성</button>
          </form>
        </div>
      </div>
      <button onclick="closePostDetailModal()" class="mt-4 w-full bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl text-xs">닫기</button>
    </div>
  </div>

  <!-- [운영진 전용] 회원 정보 수정 모달 -->
  <div id="editMemberModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <h3 class="text-lg font-black text-indigo-950 mb-4">회원 정보 수정</h3>
      <form onsubmit="handleSaveEditMember(event)" class="space-y-3">
        <input type="hidden" id="editMemberDocId" />
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">회원 이름</label>
          <input type="text" id="editMemberName" required class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">직책</label>
          <select id="editMemberRole" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs bg-white">
            <option value="member">일반회원</option>
            <option value="admin">운영진</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">출석률 (예: 85%)</label>
          <input type="text" id="editMemberRate" placeholder="예: 85%" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeEditMemberModal()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-xs">취소</button>
          <button type="submit" class="w-1/2 bg-indigo-950 text-white font-bold py-2.5 rounded-xl text-xs">수정 완료</button>
        </div>
      </form>
    </div>
  </div>

  <!-- [운영진 전용] 새 일정 추가 모달 -->
  <div id="addEventModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
      <div class="flex justify-between items-center mb-4 pb-2 border-b">
        <h3 class="text-base font-black text-indigo-950">📅 새 일정 추가</h3>
        <button onclick="closeAddEventModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <form onsubmit="handleCreateEvent(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">구분</label>
          <select id="newEventCategory" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs bg-white">
            <option value="regular">정기운동</option>
            <option value="match">대회 / 특별일정</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">일정 제목</label>
          <input type="text" id="newEventTitle" required placeholder="예: 목요 정기운동" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">날짜</label>
            <input type="date" id="newEventDate" required class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">시간</label>
            <input type="time" id="newEventTime" required value="19:30" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">장소</label>
          <input type="text" id="newEventLocation" required placeholder="예: 순천 팔마체육관" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">상세 내용</label>
          <textarea id="newEventDesc" rows="3" placeholder="운동 관련 메모나 준비물을 적어주세요." class="w-full p-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none"></textarea>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeAddEventModal()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-xs">취소</button>
          <button type="submit" class="w-1/2 bg-indigo-950 text-white font-bold py-2.5 rounded-xl text-xs">일정 등록</button>
        </div>
      </form>
    </div>
  </div>

        "08-15", // 광복절
        "10-03", // 개천절
        "10-09", // 한글날
        "12-25"  // 성탄절
      ];
      const monthDayStr = `${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      if (fixedHolidays.includes(monthDayStr)) return true;

      // 2. 연도별 주요 음력/대체 공휴일 목록 (2026~2027)
      const variableHolidays = [
        // 2026년
        "2026-02-16", "2026-02-17", "2026-02-18", // 설날 연휴
        "2026-05-24", "2026-05-25", // 부처님오신날 및 대체공휴일
        "2026-09-24", "2026-09-25", "2026-09-26", // 추석 연휴
        "2026-10-05", // 개천절 대체공휴일
        // 2027년
        "2027-02-06", "2027-02-07", "2027-02-08", "2027-02-09", // 설날
        "2027-05-13", // 부처님오신날
        "2027-09-14", "2027-09-15", "2027-09-16"  // 추석
      ];

      return variableHolidays.includes(dateStr);
    }

    // --- Firestore 실시간 리스너 설정 ---
    function setupFirestoreListeners() {
      // 1. 회원 목록
      onSnapshot(collection(db, "members"), (snapshot) => {
        sampleData.members = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        refreshCurrentTab();
      });

      // 2. 게시글 목록
      onSnapshot(collection(db, "posts"), (snapshot) => {
        sampleData.boardPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        refreshCurrentTab();
      });

      // 3. 댓글 목록
      onSnapshot(collection(db, "comments"), (snapshot) => {
        sampleData.comments = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (currentViewingPostId) renderPostComments(currentViewingPostId);
        if (currentTab === 'myinfo') renderMyInfoTab(document.getElementById('app'));
      });

      // 4. 익명 건의사항 목록
      onSnapshot(collection(db, "suggestions"), (snapshot) => {
        sampleData.suggestions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        refreshCurrentTab();
      });

      // 5. 일정 목록
      onSnapshot(collection(db, "events"), (snapshot) => {
        sampleData.events = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        refreshCurrentTab();
      });

      // 6. 정기운동 투표 현황
      onSnapshot(collection(db, "regularVotes"), (snapshot) => {
        const votes = {};
        snapshot.docs.forEach(doc => {
          votes[doc.id] = doc.data().votes || {};
        });
        sampleData.regularVotesByDate = votes;

        // 메인 탭 정기운동 출석 카운트 갱신
        const dateKey = "2026-09-17";
        const curDateVotes = votes[dateKey] || {};
        let attCount = 0, absCount = 0, penCount = 0;
        
        Object.keys(curDateVotes).forEach(name => {
          if (curDateVotes[name] === '참가') attCount++;
          else if (curDateVotes[name] === '불참') absCount++;
          else penCount++;
        });

        sampleData.regularAttendance.counts = { attend: attCount, absent: absCount, pending: penCount };
        if (currentUser && curDateVotes[currentUser.name]) {
          sampleData.regularAttendance.myStatus = curDateVotes[currentUser.name];
        }

        refreshCurrentTab();
      });

      // 7. 특별 투표 결과 현황
      onSnapshot(collection(db, "specialVotes"), (snapshot) => {
        const votes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const attendVoters = [];
        const absentVoters = [];
        const pendingVoters = [];

        votes.forEach(v => {
          const text = v.reason ? `${v.name} (${v.reason})` : v.name;
          if (v.choice === "참석") attendVoters.push(text);
          else if (v.choice === "불참") absentVoters.push(text);
          else pendingVoters.push(text);

          if (currentUser && v.name === currentUser.name) {
            sampleData.specialVote.myStatus = { choice: v.choice, reason: v.reason || "" };
          }
        });

        sampleData.specialVote.results = [
          { choice: `참석 (${attendVoters.length}명)`, voters: attendVoters },
          { choice: `불참 (${absentVoters.length}명)`, voters: absentVoters },
          { choice: `미정 (${pendingVoters.length}명)`, voters: pendingVoters }
        ];

        // 나의 투표 이력 동기화
        sampleData.myVotes = votes.filter(v => currentUser && v.name === currentUser.name).map(v => ({
          title: sampleData.specialVote.title,
          choice: v.choice,
          date: v.date || "09.14"
        }));

        refreshCurrentTab();
      });
    }

    // --- 페이지네이션 UI ---
    function paginate(array, pageSize, pageNumber) {
      return array.slice((pageNumber - 1) * pageSize, pageNumber * pageSize);
    }

    function renderPaginationUI(totalItems, pageSize, currentPage, onPageChangeFnName) {
      const totalPages = Math.ceil(totalItems / pageSize);
      if (totalPages <= 1) return '';

      let pageBtns = '';
      for (let i = 1; i <= totalPages; i++) {
        const isActive = i === currentPage;
        pageBtns += `
          <button onclick="window.${onPageChangeFnName}(${i})" class="w-7 h-7 text-xs font-bold rounded-lg transition ${isActive ? 'bg-indigo-950 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
            ${i}
          </button>
        `;
      }

      return `
        <div class="flex items-center justify-center gap-1.5 pt-4 border-t border-gray-100 mt-3">
          <button onclick="window.${onPageChangeFnName}(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="opacity-30 cursor-not-allowed text-xs px-2 py-1 font-bold text-gray-500"' : 'class="text-xs px-2 py-1 font-bold text-indigo-900 hover:bg-gray-100 rounded"'}>
            이전
          </button>
          <div class="flex items-center gap-1">${pageBtns}</div>
          <button onclick="window.${onPageChangeFnName}(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="opacity-30 cursor-not-allowed text-xs px-2 py-1 font-bold text-gray-500"' : 'class="text-xs px-2 py-1 font-bold text-indigo-900 hover:bg-gray-100 rounded"'}>
            다음
          </button>
        </div>
      `;
    }

    // --- 월별 정기 운동 일정 자동 생성 핸들러 ---
    window.handleAutoGenerateMonthlyEvents = async (e) => {
      e.preventDefault();
      const monthVal = document.getElementById('autoGenMonth').value; // YYYY-MM
      const timeVal = document.getElementById('autoGenTime').value;
      const locationVal = document.getElementById('autoGenLocation').value.trim();
      const descVal = document.getElementById('autoGenDesc').value.trim();

      const dayCheckboxes = document.querySelectorAll('input[name="autoDay"]:checked');
      const selectedDays = Array.from(dayCheckboxes).map(cb => parseInt(cb.value));

      if (selectedDays.length === 0) {
        return alert('정기 운동 요일을 최소 하나 이상 선택해 주세요.');
      }

      const [yearStr, monthStr] = monthVal.split('-');
      const year = parseInt(yearStr);
      const month = parseInt(monthStr);

      const daysInMonth = new Date(year, month, 0).getDate();
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

      let addedCount = 0;
      let skippedHolidays = [];

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month - 1, day);
        const dayOfWeek = dateObj.getDay();

        if (selectedDays.includes(dayOfWeek)) {
          const dateString = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          
          // 공휴일인 경우 자동 등록 생략
          if (isKoreanHoliday(dateObj)) {
            skippedHolidays.push(dateString);
            continue;
          }

          const dayName = dayNames[dayOfWeek];
          const title = `${dayName}요 정기운동`;

          await addDoc(collection(db, "events"), {
            type: "regular",
            title: title,
            date: dateString,
            time: timeVal,
            location: locationVal,
            description: descVal,
            createdAt: serverTimestamp()
          });

          addedCount++;
        }
      }

      let alertMsg = `🎉 ${year}년 ${month}월 총 ${addedCount}개의 정기 운동 일정이 자동으로 등록되었습니다!`;
      if (skippedHolidays.length > 0) {
        alertMsg += `\n\n⛔ (휴무 반영) 공휴일 제외 날짜:\n${skippedHolidays.join('\n')}`;
      }
      alert(alertMsg);
    };

    // --- 운영진 일정 관리 함수 ---
    window.openAddEventModal = () => document.getElementById('addEventModal').classList.remove('hidden');

    window.handleCreateEvent = async (e) => {

        type, title, date, time, location, description,

      alert(`[${title}] 일정이 추가되었습니다.`);

    };

    window.deleteEvent = async (eventId) => {

    window.resetMemberPassword = async (memberDocId) => {

    // --- 초기화 데이터 생성 ---
    async function initDatabaseIfEmpty() {
      const membersSnap = await getDocs(collection(db, "members"));
      if (membersSnap.empty) {
        const sampleMembers = [
          { name: "회장님", role: "admin", rate: "92%", password: "0000" },
          { name: "운영진", role: "admin", rate: "88%", password: "0000" },
          { name: "홍길동", role: "member", rate: "85%", password: "0000" },
          { name: "김철수", role: "member", rate: "70%", password: "0000" },
          { name: "이영희", role: "member", rate: "95%", password: "0000" }
        ];
        for (const m of sampleMembers) {
          await setDoc(doc(db, "members", m.name), m);
        }
      }

      const eventsSnap = await getDocs(collection(db, "events"));
      if (eventsSnap.empty) {
        const sampleEvents = [
          { date: "2026-09-15", time: "19:30", title: "화요 정기운동", type: "regular", location: "순천 팔마체육관", description: "서브 및 기본기 훈련 후 6:6 미니 게임 진행 예정입니다." },
          { date: "2026-09-17", time: "19:30", title: "목요 정기운동", type: "regular", location: "순천 팔마체육관", description: "팀 전술 훈련 및 리시브 전담 연습이 잡혀있습니다." },
          { date: "2026-09-22", time: "19:30", title: "화요 정기운동", type: "regular", location: "순천 팔마체육관", description: "포지션별 집중 전술 훈련입니다." },
          { date: "2026-09-26", time: "09:00", title: "순천만배 전국배구대회", type: "match", location: "순천 팔마체육관 메인경기장", description: "2026 순천만배 전국배구대회 본선 경기입니다." }
        ];
        for (const evt of sampleEvents) {
          await addDoc(collection(db, "events"), evt);
        }
      }
    }

    // --- DOM Loaded ---
    window.addEventListener('DOMContentLoaded', async () => {
      renderHeader();
      setupFirestoreListeners();
      await initDatabaseIfEmpty();
      window.switchTab('home');
    });
  </script>
