              <button type="submit" class="w-full bg-indigo-950 hover:bg-indigo-900 text-white text-xs font-bold py-2.5 rounded-lg shadow-sm">선택 월 정기운동 일괄 생성</button>
            </form>
          </div>

          <!-- 2. 동호회 회원 명단 관리 (비밀번호 표출 및 수정 기능 추가) -->
          <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-xs sm:text-sm font-black text-gray-900 flex items-center gap-1.5"><span>👥</span> 동호회 회원 명단 관리</h3>
              <button onclick="window.openAddMemberModal()" class="bg-indigo-950 text-white text-xs px-3 py-1.5 rounded-xl font-bold hover:bg-indigo-900 shadow-sm transition">
                + 새 회원 추가
              </button>
            </div>

            <div class="overflow-x-auto min-h-[200px]">
              <table class="w-full text-left border-collapse min-w-[500px]">
                <thead>
                  <tr class="border-b border-gray-200 text-[11px] font-bold text-gray-400 uppercase bg-gray-50">
                    <th class="p-2.5 rounded-l-xl">이름</th>
                    <th class="p-2.5">직책</th>
                    <th class="p-2.5">비밀번호</th>
                    <th class="p-2.5 text-right rounded-r-xl">관리</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 text-xs">
                  ${pagedMembers.length === 0 ? '<tr><td colspan="4" class="text-center py-6 text-gray-400">등록된 회원이 없습니다.</td></tr>' : ''}
                  ${pagedMembers.map(m => `
                    <tr class="hover:bg-gray-50 transition">
                      <td class="p-2.5 font-bold text-gray-900">${m.name}</td>
                      <td class="p-2.5">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${m.role === 'admin' ? 'bg-indigo-100 text-indigo-900' : 'bg-gray-100 text-gray-700'}">
                          ${roleLabels[m.role] || '일반회원'}
                        </span>
                      </td>
                      <td class="p-2.5 font-mono text-gray-600 font-bold">${m.password || '0000'}</td>
                      <td class="p-2.5 text-right space-x-1">
                        <button onclick="window.openEditMemberModal('${m.id}', '${m.name}', '${m.role}', '${m.password || '0000'}')" class="text-[11px] bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded-lg font-bold border border-gray-200">수정</button>
                        <button onclick="window.handleResetPassword('${m.name}')" class="text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-700 px-2 py-1 rounded-lg font-bold border border-amber-200">초기화</button>
                        <button onclick="window.handleDeleteMember('${m.name}')" class="text-[11px] bg-rose-50 hover:bg-rose-100 text-rose-600 px-2 py-1 rounded-lg font-bold border border-rose-200">삭제</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
            ${renderPaginationUI(sortedMembers.length, 5, pageState.adminMembers, 'changeAdminMembersPage')}
          </div>
          <!-- 1. Section 3: 동호회 일정 관리 (수정 기능 및 확장된 카테고리) -->
          <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-xs sm:text-sm font-black text-gray-900 flex items-center gap-1.5"><span>📅</span> 일정 관리 (정기, 대회, 회식, 기타)</h3>
              <button onclick="window.openAddEventModal()" class="bg-indigo-900 text-white text-xs px-2.5 py-1.5 rounded-xl font-bold hover:bg-indigo-800">+ 일정 추가</button>
            </div>
            <div class="space-y-2 min-h-[190px]">
              ${sortedEvents.length === 0 ? '<p class="text-xs text-gray-400 py-8 text-center">등록된 일정이 없습니다.</p>' : ''}
              ${pagedEvents.map(evt => `
                <div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-xl text-xs gap-2">
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1.5">
                      <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${evt.type === 'match' ? 'bg-amber-100 text-amber-800' : evt.type === 'dinner' ? 'bg-amber-100 text-amber-800' : evt.type === 'etc' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'}">${categoryNames[evt.type] || '정기'}</span>
                      <span class="font-bold text-gray-900 truncate">${evt.title}</span>
                    </div>
                    <p class="text-[11px] text-gray-500 mt-0.5">${evt.date} (${evt.time || ''}) | ${evt.location || '장소미정'}</p>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    <button onclick="window.openEditEventModal('${evt.id}')" class="text-[10px] bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-2 py-1 rounded border border-indigo-200 font-bold">✏️ 수정</button>
                    <button onclick="window.handleDeleteEvent('${evt.id}')" class="text-[10px] bg-rose-50 text-rose-600 hover:bg-rose-100 px-2 py-1 rounded border border-rose-200 font-bold">삭제</button>
                  </div>
                </div>
              `).join('')}
            </div>
            ${renderPaginationUI(sortedEvents.length, 5, pageState.adminEvents, 'changeAdminEventsPage')}
          </div>

          <!-- 2. Section 4: 정기운동 참가 수동 변경 (대상 일자 순서 정렬) -->
          <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-xs sm:text-sm font-black text-gray-900 flex items-center gap-1.5"><span>✍️</span> 정기운동 참가 명단 수동 수정</h3>
              <div class="flex items-center gap-1">
                <label class="text-[11px] font-bold text-gray-600">대상 일자:</label>
                <select onchange="window.handleAdminDateChange(this.value)" class="p-1 border border-gray-300 rounded-lg text-xs font-bold bg-gray-50 max-w-[140px] truncate">
                  ${sortedVoteDates.map(d => `<option value="${d}" ${d === selectedAdminDate ? 'selected' : ''}>${d} ${!isVoteDatePast(d) ? '(예정)' : '(지난운동)'}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="space-y-2 min-h-[190px]">
              ${sortedMembers.length === 0 ? '<p class="text-xs text-gray-400 py-8 text-center">등록된 회원이 없습니다.</p>' : ''}
              ${pagedVoteMembers.map(m => {
                const status = curVotes[m.name] || '미정';
                return `
                  <div class="flex justify-between items-center p-2 bg-gray-50 rounded-xl text-xs">
                    <span class="font-bold text-gray-800">${m.name}</span>
                    <div class="flex gap-1">
                      <button onclick="window.updateAdminMemberAttendance('${m.name}', '참가')" class="px-2 py-1 rounded text-[10px] font-bold ${status === '참가' ? 'bg-emerald-600 text-white' : 'bg-white border text-gray-600'}">참가</button>
                      <button onclick="window.updateAdminMemberAttendance('${m.name}', '불참')" class="px-2 py-1 rounded text-[10px] font-bold ${status === '불참' ? 'bg-rose-600 text-white' : 'bg-white border text-gray-600'}">불참</button>
                      <button onclick="window.updateAdminMemberAttendance('${m.name}', '미정')" class="px-2 py-1 rounded text-[10px] font-bold ${status === '미정' ? 'bg-amber-500 text-white' : 'bg-white border text-gray-600'}">미정</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
            ${renderPaginationUI(sortedMembers.length, 5, pageState.adminRegularVotes, 'changeAdminRegularVotesPage')}
          </div>

          ${reactionLogHTML}

          <!-- Section 5: 익명 건의사항 검토 (작성자 비공개 유지) -->
          <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-xs sm:text-sm font-black text-gray-900 mb-1 flex items-center gap-1.5"><span>🔒</span> 익명 건의사항 목록</h3>
            <p class="text-[11px] text-gray-400 mb-3">운영진만 열람 가능한 영역입니다. 작성자 정보는 운영진에게도 표시되지 않습니다.</p>
            <div class="space-y-2 min-h-[160px]">
              ${sampleData.suggestions.length === 0 ? '<p class="text-xs text-gray-400 py-8 text-center">접수된 건의사항이 없습니다.</p>' : ''}
              ${pagedSuggestions.map(s => `
                <div class="p-3 bg-gray-50 rounded-xl text-xs space-y-1">
                  <div class="flex justify-between items-center">
                    <span class="font-bold text-indigo-950">${s.date} 접수${s.edited ? ' (수정됨)' : ''}</span>
                    <button onclick="window.deleteSuggestion('${s.id}')" class="text-[10px] bg-rose-50 text-rose-600 px-1.5 py-0.5 rounded font-bold border border-rose-200">삭제</button>
                  </div>
                  <p class="text-gray-700 leading-relaxed">${s.text}</p>
                </div>
              `).join('')}
            </div>
            ${renderPaginationUI(sampleData.suggestions.length, 5, pageState.adminSuggestions, 'changeAdminSuggestionsPage')}
          </div>
        </div>
      `;
    }

    window.changeAdminMembersPage = (p) => { pageState.adminMembers = p; renderAdminTab(document.getElementById('app')); };
    window.changeAdminSuggestionsPage = (p) => { pageState.adminSuggestions = p; renderAdminTab(document.getElementById('app')); };
    window.changeAdminEventsPage = (p) => { pageState.adminEvents = p; renderAdminTab(document.getElementById('app')); };
    window.changeAdminRegularVotesPage = (p) => { pageState.adminRegularVotes = p; renderAdminTab(document.getElementById('app')); };
    window.changeAdminAttendanceRankPage = (p) => { pageState.adminAttendanceRank = p; renderAdminTab(document.getElementById('app')); };
    window.changeAdminReactionsPage = (p) => { pageState.adminReactions = p; renderAdminTab(document.getElementById('app')); };

    window.handleAdminDateChange = (d) => {
      selectedAdminDate = d;
      renderAdminTab(document.getElementById('app'));
    };

    window.updateAdminMemberAttendance = async (name, status) => {
      if(!selectedAdminDate) return;
      const votesObj = sampleData.regularVotesByDate[selectedAdminDate] || {};
      votesObj[name] = status;
      await setDoc(doc(db, "regularVotes", selectedAdminDate), { votes: votesObj }, { merge: true });
    };

    window.handleGenerateMonthlyEvents = async (e) => {
      e.preventDefault();
      const monthStr = document.getElementById('genMonth').value; // YYYY-MM
      const timeStr = document.getElementById('genTime').value;
      const locStr = document.getElementById('genLocation').value;
      
      const dayCheckboxes = document.querySelectorAll('input[name="genDay"]:checked');
      const selectedDays = Array.from(dayCheckboxes).map(cb => parseInt(cb.value));

      if(selectedDays.length === 0) return alert('최소 하나 이상의 요일을 선택해 주세요.');

      const [year, month] = monthStr.split('-').map(Number);
      const daysInMonth = new Date(year, month, 0).getDate();

      let createdCount = 0;
      for(let day = 1; day <= daysInMonth; day++) {
        const dObj = new Date(year, month - 1, day);
        if(selectedDays.includes(dObj.getDay())) {
          const formattedDate = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const titleName = dObj.getDay() === 2 ? '화요 정기운동' : dObj.getDay() === 4 ? '목요 정기운동' : '정기운동';

          const existing = sampleData.events.find(e => e.date === formattedDate && e.type === 'regular');
          if(!existing) {
            await addDoc(collection(db, "events"), {
              title: titleName,
              date: formattedDate,
              time: timeStr,
              location: locStr,
              type: 'regular',
              description: `${formattedDate} VEGA 정기운동입니다.`
            });
            createdCount++;
          }
        }
      }

      alert(`${monthStr} 월에 총 ${createdCount}개의 정기운동 일정이 새로 등록되었습니다.`);
    };

    window.openAddMemberModal = () => document.getElementById('addMemberModal').classList.remove('hidden');
    window.closeAddMemberModal = () => document.getElementById('addMemberModal').classList.add('hidden');

    window.handleCreateMember = async (e) => {
      e.preventDefault();
      const name = document.getElementById('addMemberName').value.trim();
      const role = document.getElementById('addMemberRole').value;
      const pass = document.getElementById('addMemberPassword').value.trim();

      await setDoc(doc(db, "members", name), { name, role, password: pass });
      alert('새 회원이 등록되었습니다.');
      window.closeAddMemberModal();
    };

    window.openEditMemberModal = (id, name, role) => {
      document.getElementById('editMemberDocId').value = id;
      document.getElementById('editMemberName').value = name;
      document.getElementById('editMemberRole').value = role;
      document.getElementById('editMemberModal').classList.remove('hidden');
    };
    window.closeEditMemberModal = () => document.getElementById('editMemberModal').classList.add('hidden');

    window.handleSaveEditMember = async (e) => {
      e.preventDefault();
      const id = document.getElementById('editMemberDocId').value;
      const name = document.getElementById('editMemberName').value.trim();
      const role = document.getElementById('editMemberRole').value;

      await setDoc(doc(db, "members", id), { name, role }, { merge: true });
      alert('회원 정보가 수정되었습니다.');
      window.closeEditMemberModal();
    };

    /* [수정] 회원 비밀번호 초기화 (운영진 전용) - 초기 비밀번호 0000으로 되돌림.
       초기화된 회원은 다음 로그인 시 비밀번호 변경 창이 강제로 표시됩니다. */
    window.handleResetPassword = async (name) => {
      if (!currentUser || currentUser.role !== 'admin') return alert('비밀번호 초기화는 운영진만 가능합니다.');
      if (!confirm(`'${name}' 회원의 비밀번호를 초기값(0000)으로 초기화하시겠습니까?`)) return;

      const member = sampleData.members.find(m => m.name === name);
      const docId = member ? member.id : name;

      try {
        await setDoc(doc(db, "members", String(docId)), { password: "0000" }, { merge: true });
        alert(`'${name}' 회원의 비밀번호가 0000으로 초기화되었습니다.\n다음 로그인 시 새 비밀번호로 변경해야 합니다.`);
      } catch (err) {
        console.error(err);
        alert('비밀번호 초기화 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
      }
    };

    window.handleDeleteMember = async (id) => {
      if(confirm('이 회원을 삭제하시겠습니까?')) {
        await deleteDoc(doc(db, "members", id));
        alert('삭제되었습니다.');
      }
    };

    /* 1. 일정 추가 및 수정 모달 열기 구현 */
    window.openAddEventModal = () => {
      if (!currentUser || currentUser.role !== 'admin') return alert('일정 등록은 운영진만 가능합니다.');
      document.getElementById('editEventId').value = '';
      document.getElementById('eventModalTitle').innerText = '📅 새 일정 추가';
      document.getElementById('newEventTitle').value = '';
      document.getElementById('newEventDate').value = getTodayString();
      document.getElementById('newEventTime').value = '19:30';
      document.getElementById('newEventLocation').value = '순천 조례초';
      document.getElementById('newEventDesc').value = '';
      document.getElementById('newEventCategory').value = 'regular';
      document.getElementById('eventSubmitBtn').innerText = '일정 등록';
      document.getElementById('addEventModal').classList.remove('hidden');
    };

    window.openEditEventModal = (eventId) => {
      if (!currentUser || currentUser.role !== 'admin') return alert('일정 수정은 운영진만 가능합니다.');
      const evt = sampleData.events.find(e => String(e.id) === String(eventId));
      if(!evt) return;

      document.getElementById('editEventId').value = evt.id;
      document.getElementById('eventModalTitle').innerText = '✏️ 일정 수정';
      document.getElementById('newEventTitle').value = evt.title || '';
      document.getElementById('newEventDate').value = evt.date || getTodayString();
      document.getElementById('newEventTime').value = evt.time || '19:30';
      document.getElementById('newEventLocation').value = evt.location || '';
      document.getElementById('newEventDesc').value = evt.description || '';
      document.getElementById('newEventCategory').value = evt.type || 'regular';
      document.getElementById('eventSubmitBtn').innerText = '수정 완료';
      document.getElementById('addEventModal').classList.remove('hidden');
    };

    window.closeAddEventModal = () => document.getElementById('addEventModal').classList.add('hidden');

    window.handleCreateEvent = async (e) => {
      e.preventDefault();
      if (!currentUser || currentUser.role !== 'admin') return alert('일정 저장은 운영진만 가능합니다.');

      const editId = document.getElementById('editEventId').value;
      const title = document.getElementById('newEventTitle').value.trim();
      const date = document.getElementById('newEventDate').value;
      const time = document.getElementById('newEventTime').value;
      const location = document.getElementById('newEventLocation').value.trim();
      const desc = document.getElementById('newEventDesc').value.trim();
      const type = document.getElementById('newEventCategory').value;

      const eventData = {
        title: title,
        date: date,
        time: time,
        location: location,
        description: desc,
        type: type
      };

      if (editId) {
        await setDoc(doc(db, "events", String(editId)), eventData, { merge: true });
        alert('일정이 성공적으로 수정되었습니다.');
      } else {
        await addDoc(collection(db, "events"), eventData);
        alert('새 일정이 추가되었습니다.');
      }

      window.closeAddEventModal();
    };

    window.handleDeleteEvent = async (id) => {
      if(confirm('이 일정을 삭제하시겠습니까?')) {
        await deleteDoc(doc(db, "events", String(id)));
        alert('삭제되었습니다.');
      }
    };

    window.deleteSuggestion = async (id) => {
      if(confirm('건의사항을 삭제하시겠습니까?')) {
        await deleteDoc(doc(db, "suggestions", String(id)));
        alert('삭제되었습니다.');
      }
    };
  
    /* ===== VEGA 확장 모듈 연결 ===== */
    window.__vega = {
      db, sampleData, showToast, sortMembers, isEventPast, getTodayString,
      user: () => currentUser,
      tab: () => currentTab,
      refresh: refreshCurrentTab
    };
    import('./vega-extras.js');
  </script>
  <script>
    /* PWA: 서비스 워커 등록 + 설치 버튼용 이벤트 보관 */
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__deferredInstall = e; if (window.__vegaPaint) window.__vegaPaint(); });
    window.addEventListener('appinstalled', () => { window.__deferredInstall = null; if (window.__vegaPaint) window.__vegaPaint(); });
  </script>
</body>
</html>
